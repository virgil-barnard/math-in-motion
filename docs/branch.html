<script>/* Portable document contract v1. Parent identity is checked; no network access. */
const MotionBridge = (() => {
  const channel = 'mathematics-in-motion/v1';
  let hooks = null;
  const lesson = document.documentElement.dataset.lesson;
  const embedded = window.parent !== window;
  if (embedded) document.documentElement.classList.add('embedded');
  function send(type, extra = {}) {
    if (embedded) window.parent.postMessage({channel, lesson, type, ...extra}, '*');
  }
  function changed() { if (hooks) send('state', {state: hooks.snapshot()}); }
  window.addEventListener('message', event => {
    if (!embedded || event.source !== window.parent || event.data?.channel !== channel || !hooks) return;
    const data = event.data;
    if (data.type === 'restore') {
      if (data.state) hooks.restore(data.state);
      changed();
    } else if (data.type === 'pause') {
      hooks.pause();
      send('paused', {request: data.request, state: hooks.snapshot()});
    }
  });
  return {
    connect(value) { hooks = value; send('ready'); },
    changed,
    explored() { send('explored'); }
  };
})();
</script>
<script>/* Small optional author kit. Lessons own models, state, geometry, and gestures. */
const MotionKit = (() => {
  const C = ['#eedbb6','#83d6d1','#b7a4e8','#d8a78b'];
  const shapes = ['circle','square','triangle','diamond'];
  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
  const smooth = x => x*x*(3-2*x);
  const f = x => Number(x).toFixed(3);
  const svg = body => `<svg viewBox="0 0 48 48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  function shape(kind,x,y,r,color=C[0],filled=true,opacity=1) {
    const a=`fill="${filled?color:'none'}" stroke="${color}" stroke-width="${filled?.7:1.2}" opacity="${opacity}" stroke-linejoin="round"`;
    if(kind==='circle')return `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" ${a}/>`;
    if(kind==='square')return `<rect x="${f(x-r)}" y="${f(y-r)}" width="${2*r}" height="${2*r}" rx="2.5" ${a}/>`;
    if(kind==='triangle')return `<path d="M${f(x)} ${f(y-r*1.15)}L${f(x+r)} ${f(y+r*.8)}L${f(x-r)} ${f(y+r*.8)}Z" ${a}/>`;
    return `<path d="M${f(x)} ${f(y-r*1.2)}L${f(x+r)} ${f(y)}L${f(x)} ${f(y+r*1.2)}L${f(x-r)} ${f(y)}Z" ${a}/>`;
  }
  const icons={
    play:svg('<path d="m18 10 20 14-20 14Z" fill="currentColor"/>'),
    pause:svg('<path d="M18 12v24M30 12v24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>'),
    rewind:svg('<path d="M12 12a16 16 0 1 1-3 20M12 3v11H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'),
    example:svg('<rect x="5" y="5" width="27" height="27" rx="8" fill="none" stroke="currentColor" opacity=".45"/><rect x="16" y="16" width="27" height="27" rx="8" fill="#102230" stroke="currentColor"/><circle cx="24" cy="24" r="2" fill="currentColor"/><circle cx="35" cy="35" r="2" fill="currentColor"/>'),
    silent:svg('<path d="M7 18h7l10-8v28l-10-8H7ZM33 18l10 12M43 18 33 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'),
    sound:svg('<path d="M7 18h7l10-8v28l-10-8H7ZM32 17q7 7 0 14M38 10q13 14 0 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>')
  };
  function create(spec) {
    const $=id=>document.getElementById(id);
    const stage=$('stage'),scene=$('scene'),objects=$('objects'),range=$('timeline'),play=$('play');
    let w=640,h=500,frame=0,animation=null,drag=null,suppress=null,lastStatus='';
    let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let audio=null,enabled=false;
    const buttons=new Map();
    $('lesson-title').textContent=spec.title;
    $('lesson-description').textContent=spec.description;
    $('lesson-glyph').innerHTML=spec.glyph;
    $('rewind').innerHTML=icons.rewind;$('example').innerHTML=icons.example;$('sound').innerHTML=icons.silent;
    function announce(text) {if(text!==lastStatus){$('status').textContent=text;lastStatus=text;}}
    function stop(){animation=null;cancelAnimationFrame(frame);frame=0;play.innerHTML=icons.play;play.setAttribute('aria-label','Play the transformation');}
    function paint(body,items=[]) {
      scene.innerHTML=body;
      const seen=new Set();
      for(const item of items){
        seen.add(item.key);let b=buttons.get(item.key);
        if(!b){b=document.createElement('button');b.type='button';b.dataset.key=item.key;objects.appendChild(b);buttons.set(item.key,b);}
        b.className=`piece ${item.kind||'token'}${drag?.key===item.key?' dragging':''}`;
        b.style.left=`${item.x}px`;b.style.top=`${item.y}px`;
        b.setAttribute('aria-label',item.label);
        if(item.selected!==undefined)b.setAttribute('aria-pressed',String(item.selected));
        const art=item.art??svg(shape(item.shape||'circle',24,24,11,item.color||C[0]));
        if(b.dataset.art!==art){b.innerHTML=art;b.dataset.art=art;}
      }
      for(const [key,b] of buttons)if(!seen.has(key)){b.remove();buttons.delete(key);}
    }
    function render(){spec.render(api);range.value=String(clamp(spec.progress())*1000);range.setAttribute('aria-valuetext',spec.describe());}
    function changed(){announce(spec.describe());MotionBridge.changed();}
    function tone(index=0){
      if(!enabled||!audio)return;
      const time=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();
      osc.frequency.value=[261.63,329.63,392,523.25][Math.abs(index)%4];
      gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.045,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+.38);
      osc.connect(gain);gain.connect(audio.destination);osc.start(time);osc.stop(time+.4);osc.onended=()=>{osc.disconnect();gain.disconnect();};
    }
    function tween(from,to,setter,duration=600,after=null){
      stop();
      if(reduced||Math.abs(to-from)<1e-8){setter(to);render();after?.();changed();return;}
      animation={from,to,setter,start:performance.now(),duration,after};
      play.innerHTML=icons.pause;play.setAttribute('aria-label','Pause the transformation');
      const tick=now=>{
        if(!animation)return;const a=animation,t=clamp((now-a.start)/a.duration);
        a.setter(t===1?a.to:a.from+(a.to-a.from)*smooth(t));render();
        if(t===1){stop();a.after?.();changed();}else frame=requestAnimationFrame(tick);
      };frame=requestAnimationFrame(tick);
    }
    function cancelDrag(){if(!drag)return;const old=drag;drag=null;spec.cancel?.(old);try{old.button.releasePointerCapture(old.pointer);}catch{}render();}
    function point(event){const r=stage.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top};}
    objects.addEventListener('pointerdown',event=>{
      const button=event.target.closest('button[data-key]');if(!button||drag||event.button!==0)return;
      stop();suppress=null;const p=point(event),key=button.dataset.key;
      const detail=spec.down?.(key,p);if(!detail)return;
      drag={...detail,key,button,pointer:event.pointerId,start:p,moved:false};
      button.setPointerCapture(event.pointerId);render();
    });
    objects.addEventListener('pointermove',event=>{
      if(!drag||drag.pointer!==event.pointerId)return;const p=point(event);
      if(!drag.moved&&Math.hypot(p.x-drag.start.x,p.y-drag.start.y)<3)return;
      drag.moved=true;spec.move?.(drag,p);render();
    });
    objects.addEventListener('pointerup',event=>{
      if(!drag||drag.pointer!==event.pointerId)return;const ended=drag;drag=null;
      try{ended.button.releasePointerCapture(ended.pointer);}catch{}
      if(ended.moved){suppress=ended.key;spec.up?.(ended,point(event));render();changed();MotionBridge.explored();}
    });
    for(const name of ['pointercancel','lostpointercapture'])objects.addEventListener(name,event=>{if(drag?.pointer===event.pointerId){cancelDrag();changed();}});
    objects.addEventListener('click',event=>{
      const button=event.target.closest('button[data-key]');if(!button)return;
      if(event.detail>0&&suppress===button.dataset.key){suppress=null;return;}
      suppress=null;stop();spec.activate?.(button.dataset.key);render();changed();MotionBridge.explored();
    });
    objects.addEventListener('keydown',event=>{
      const button=event.target.closest('button[data-key]');if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
      if(spec.nudge){event.preventDefault();cancelDrag();stop();spec.nudge(button.dataset.key,['ArrowRight','ArrowUp'].includes(event.key)?1:-1,event.key);render();changed();}
    });
    play.addEventListener('click',()=>{cancelDrag();if(animation){stop();changed();return;}spec.play();render();MotionBridge.explored();});
    $('rewind').addEventListener('click',()=>{cancelDrag();stop();spec.rewind();render();changed();});
    $('example').addEventListener('click',()=>{cancelDrag();stop();spec.example();render();changed();tone(2);});
    range.addEventListener('input',()=>{const p=Number(range.value)/1000;cancelDrag();stop();spec.scrub(p);render();});
    range.addEventListener('change',()=>{spec.settle?.();render();changed();MotionBridge.explored();});
    range.addEventListener('keydown',event=>{
      if(!spec.step||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
      event.preventDefault();cancelDrag();stop();spec.step(['ArrowRight','ArrowUp'].includes(event.key)?1:-1);render();changed();
    });
    $('sound').addEventListener('click',async()=>{
      if(enabled){enabled=false;audio?.suspend();}else{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){announce('Optional sound is unavailable.');return;}try{audio||=new Audio();await audio.resume();enabled=true;tone(0);}catch{announce('Optional sound could not start.');return;}}
      $('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Mute optional sound':'Enable optional sound');$('sound').innerHTML=icons[enabled?'sound':'silent'];
    });
    function pause(){cancelDrag();stop();if(enabled){enabled=false;audio?.suspend();$('sound').innerHTML=icons.silent;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable optional sound');}}
    function resize(){cancelDrag();const r=stage.getBoundingClientRect();w=Math.max(260,r.width);h=Math.max(370,r.height);scene.setAttribute('viewBox',`0 0 ${w} ${h}`);render();}
    const api={get w(){return w;},get h(){return h;},get reduced(){return reduced;},paint,render,tween,stop,changed,tone,announce,
      examples(index,count){$('example-progress').innerHTML=Array.from({length:count},(_,i)=>`<span class="example-dot${i===index?' active':''}"></span>`).join('');},
      start(){stop();new ResizeObserver(resize).observe(stage);resize();MotionBridge.connect({snapshot:spec.snapshot,restore(value){pause();spec.restore(value);render();},pause});}
    };
    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();changed();}});
    window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();stop();spec.escape?.();render();changed();}});
    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduced=event.matches;if(reduced){pause();spec.settle?.();render();changed();}});
    return api;
  }
  return {C,shapes,clamp,smooth,f,svg,shape,create};
})();
</script>
<script>/* A journey is an ordered word of left/right choices, not a random trial. */
const BranchModel = (() => {
  const count=s=>1+s.seed%3;
  const create=(seed=0)=>({version:1,seed,route:[],progress:0,reference:null,record:null});
  const arrival=route=>route.reduce((sum,side)=>sum+side,0);
  function vertices(route){let k=0;return [{row:0,slot:0},...route.map((side,i)=>({row:i+1,slot:k+=side}))];}
  function choose(s,depth,side){
    if(!Number.isInteger(depth)||depth<0||depth>=count(s)||depth>s.route.length||(side!==0&&side!==1))return false;
    if(s.record)s.reference=s.record.slice();
    s.route=s.route.slice(0,depth).concat(side);s.progress=depth/count(s);return true;
  }
  function inspect(s,p){s.progress=Math.max(0,Math.min(s.route.length/count(s),p));if(s.progress===1)s.record=s.route.slice();}
  function plan(s){while(s.route.length<count(s))s.route.push(s.route.length%2);}
  function relation(s){if(!s.reference||s.route.length!==count(s)||s.progress!==1)return null;return s.route.every((x,i)=>x===s.reference[i])?'same-route':arrival(s.route)===arrival(s.reference)?'same-arrival':'different-arrival';}
  function restore(v){
    if(v?.version!==1||!Number.isSafeInteger(v.seed)||v.seed<0)return create();const n=count(v);
    const bits=a=>Array.isArray(a)&&a.every(x=>x===0||x===1),full=a=>a===null||bits(a)&&a.length===n;
    if(!bits(v.route)||v.route.length>n||!Number.isFinite(v.progress)||v.progress<0||v.progress>v.route.length/n||!full(v.reference)||!full(v.record))return create();
    return{version:1,seed:v.seed,route:v.route.slice(),progress:v.progress,reference:v.reference?.slice()??null,record:v.record?.slice()??null};
  }
  return{create,count,arrival,vertices,choose,inspect,plan,relation,restore};
})();
if(typeof module!=='undefined')module.exports=BranchModel;
</script>
<script>/* Pixel geometry for a triangular lattice of repeated equal steps. */
const BranchGeometry = (() => {
  function layout(n,w,h){const dx=Math.min(120,(w-80)/(2*n)),dy=Math.min(180,(h-136)/n),top=h*.46-dy*n/2;return{n,w,h,dx,dy,point:(row,slot)=>({x:w/2+(2*slot-row)*dx,y:top+row*dy})};}
  function point(a,b,t){const q=1-t;return{x:a.x+(b.x-a.x)*(3*t*t-2*t*t*t),y:a.y*q*q*q+3*(a.y+(b.y-a.y)*.44)*q*q*t+3*(b.y-(b.y-a.y)*.44)*q*t*t+b.y*t*t*t};}
  const edge=(a,b)=>`M${a.x} ${a.y}C${a.x} ${a.y+(b.y-a.y)*.44} ${b.x} ${b.y-(b.y-a.y)*.44} ${b.x} ${b.y}`;
  function positions(route,g){let k=0;return[g.point(0,0),...route.map((side,i)=>g.point(i+1,k+=side))];}
  function traveler(route,progress,g){const ps=positions(route,g),step=Math.min(route.length,progress*g.n),i=Math.min(route.length,Math.floor(step));return i===route.length?ps[i]:point(ps[i],ps[i+1],step-i);}
  function trace(route,progress,g){const ps=positions(route,g),steps=Math.min(route.length,progress*g.n);let d=`M${ps[0].x} ${ps[0].y}`;for(let i=0;i<Math.ceil(steps);i++){const end=Math.min(1,steps-i);for(let j=1;j<=24;j++){const p=point(ps[i],ps[i+1],end*j/24);d+=`L${p.x} ${p.y}`;}}return d;}
  function nearest(a,b,p){const score=t=>{const q=point(a,b,t);return(q.x-p.x)**2+(q.y-p.y)**2;};let best=0,value=Infinity;for(let i=0;i<=32;i++){const t=i/32,v=score(t);if(v<value){best=t;value=v;}}let lo=Math.max(0,best-1/32),hi=Math.min(1,best+1/32);for(let i=0;i<20;i++){const l=lo+(hi-lo)/3,r=hi-(hi-lo)/3;if(score(l)<score(r))hi=r;else lo=l;}let t=(lo+hi)/2;for(const end of [0,1])if(score(end)<score(t))t=end;return{t,distance:score(t)};}
  function along(route,p,g){const ps=positions(route,g);let best={progress:0,distance:Infinity};for(let i=0;i<route.length;i++){const q=nearest(ps[i],ps[i+1],p);if(q.distance<best.distance)best={progress:(i+q.t)/g.n,distance:q.distance};}return best.progress;}
  return{layout,point,edge,positions,traveler,trace,nearest,along};
})();
if(typeof module!=='undefined')module.exports=BranchGeometry;
</script>
<script>(() => {
  const M=BranchModel,G=BranchGeometry,K=MotionKit;let s=M.create(),g,held=false;
  const glyph=K.svg('<path d="M24 7v9C24 26 10 25 10 37M24 16c0 10 14 9 14 21" fill="none" stroke="#648896" stroke-width="1.5"/><circle cx="24" cy="7" r="4" fill="#eedbb6"/><circle cx="10" cy="39" r="5" fill="none" stroke="#83d6d1"/><circle cx="38" cy="39" r="5" fill="none" stroke="#83d6d1"/>');
  const ring=K.svg('<circle cx="24" cy="24" r="13" fill="#102230" fill-opacity=".55" stroke="#83d6d1" stroke-width="1.2"/><circle cx="24" cy="24" r="19" fill="none" stroke="#83d6d1" stroke-opacity=".15"/>');
  const copy=()=>JSON.parse(JSON.stringify(s)),set=p=>M.inspect(s,p),depth=()=>Math.min(M.count(s),Math.floor(s.progress*M.count(s)+1e-7));
  function describe(){const n=M.count(s),relation=M.relation(s),position=Math.round(s.progress*n*100)/100;return `${n} ${n===1?'fork':'forks'}. Journey at step ${position}. ${relation==='same-arrival'?'Different journeys, the same arrival.':relation==='same-route'?'The same journey was repeated.':relation==='different-arrival'?'These journeys have different arrivals.':s.progress===1?'Journey complete. Return to the start and try another way.':'Drag the warm bead toward either open ring, or select a ring.'}${s.reference?' The dashed trail remembers the previous completed journey.':''}`;}
  function choose(side){const i=depth();if(i>=M.count(s))return rewind();M.choose(s,i,side);view.tween(s.progress,(i+1)/M.count(s),set,620,()=>view.tone(side));}
  function rewind(){view.tween(s.progress,0,set,850);}
  function render(v){
    const n=M.count(s);g=G.layout(n,v.w,v.h);const at=G.traveler(s.route,s.progress,g),i=depth(),slot=M.arrival(s.route.slice(0,i));let body='',items=[];
    for(let row=0;row<n;row++)for(let k=0;k<=row;k++)for(const side of [0,1])body+=`<path d="${G.edge(g.point(row,k),g.point(row+1,k+side))}" fill="none" stroke="#648896" stroke-width="1.7" stroke-opacity=".22"/>`;
    for(let row=1;row<=n;row++)for(let k=0;k<=row;k++){const p=g.point(row,k);body+=`<circle cx="${p.x}" cy="${p.y}" r="${row===n?10:3}" fill="${row===n?'#102230':'#648896'}" fill-opacity=".22" stroke="#648896" stroke-opacity=".32"/>`;}
    if(s.reference){const p=g.point(n,M.arrival(s.reference));body+=`<path d="${G.trace(s.reference,1,g)}" fill="none" stroke="#b7a4e8" stroke-opacity=".58" stroke-width="2" stroke-dasharray="3 6"/><circle cx="${p.x}" cy="${p.y}" r="18" fill="none" stroke="#b7a4e8" stroke-opacity=".65" stroke-dasharray="3 5"/>`;}
    const trace=G.trace(s.route,s.progress,g);body+=`<path d="${trace}" fill="none" stroke="#eedbb6" stroke-opacity=".06" stroke-width="10"/><path d="${trace}" fill="none" stroke="#eedbb6" stroke-opacity=".9" stroke-width="2.2"/>`;
    if(i<n){for(const side of [0,1]){const p=g.point(i+1,slot+side);body+=`<path d="${G.edge(g.point(i,slot),p)}" fill="none" stroke="#83d6d1" stroke-opacity="${held?.55:.36}" stroke-width="1.8"/>`;items.push({key:`choice-${side}`,kind:'branch-choice',...p,art:ring,label:`Take the ${side?'right':'left'} branch at fork ${i+1}.`});}}
    const home=g.point(0,0);if(Math.hypot(at.x-home.x,at.y-home.y)>60)items.push({key:'home',kind:'branch-home',...home,art:K.svg('<circle cx="24" cy="24" r="12" fill="none" stroke="#eedbb6" stroke-opacity=".45"/><path d="m18 23 6-6 6 6M24 17v14" fill="none" stroke="#eedbb6" stroke-opacity=".6"/>'),label:'Return the bead to its starting place. The recorded journey remains scrubbable.'});
    const end=s.progress===1,same=M.relation(s)==='same-arrival';
    if(same)body+=`<circle cx="${at.x}" cy="${at.y}" r="33" fill="#83d6d1" fill-opacity=".035" stroke="#83d6d1" stroke-opacity=".5"/>`;
    const art=K.svg(`<circle cx="24" cy="24" r="21" fill="#eedbb6" fill-opacity="${held?.10:.035}" stroke="#eedbb6" stroke-opacity="${held?.6:.25}"/><circle cx="24" cy="24" r="11" fill="#eedbb6"/>${end?'<path d="M8 11a21 21 0 0 1 32 4M40 8v8h-8" fill="none" stroke="#83d6d1" stroke-width="1.2"/>':''}`);
    items.push({key:'traveler',kind:'branch-traveler',...at,art,label:end?'Journey complete. Tap to return to the start, or drag back along the trail.':'Warm bead. Drag toward an open ring. Tap to demonstrate one step. Left and right arrow keys choose a branch; up moves back.'});
    v.paint(body,items);v.examples(s.seed%3,3);document.getElementById('timeline').disabled=s.route.length===0;
  }
  const view=K.create({title:'Branch',description:'One warm bead meets one fork. Drag it toward an open ring or tap a ring to choose a direction. Tapping the bead demonstrates one step. Return to the starting ring and choose a different journey; a dashed trace remembers the last completed one. Later examples repeat the same fork. Some different journeys meet at the same arrival. Play and the timeline replay the chosen journey without generating a new one. This is deliberate choice, not a random or physical simulation.',glyph,render,describe,progress:()=>s.progress,snapshot:copy,restore:v=>{s=M.restore(v);held=false;},scrub:set,
    play(){if(s.progress===1)s.progress=0;M.plan(s);view.tween(s.progress,1,set,Math.max(500,(1-s.progress)*M.count(s)*1050),()=>view.tone(2));},rewind,example(){s=M.create(s.seed+1);held=false;},
    activate(key){held=false;if(key.startsWith('choice-'))choose(Number(key.at(-1)));else if(key==='home')rewind();else if(key==='traveler'){const i=depth();if(i===M.count(s))rewind();else choose(s.route[i]??i%2);}},
    nudge(key,dir,keyName){if(key!=='traveler')return;if(keyName==='ArrowUp')view.tween(s.progress,Math.max(0,Math.ceil(s.progress*M.count(s)-1e-7)-1)/M.count(s),set,450);else if(keyName==='ArrowDown'){const i=depth();if(i<M.count(s))choose(s.route[i]??i%2);}else choose(dir>0?1:0);},
    down(key){if(key!=='traveler')return null;held=true;return{original:copy(),depth:depth(),mode:s.progress===1?'trace':'choose',t:0};},
    move(d,p){
      if(d.mode==='trace'||d.depth>0&&p.y<g.point(d.depth,0).y-14){d.mode='trace';set(G.along(d.original.route,p,g));return;}
      const k=M.arrival(d.original.route.slice(0,d.depth)),a=g.point(d.depth,k),options=[0,1].map(side=>({side,...G.nearest(a,g.point(d.depth+1,k+side),p)})),best=options.reduce((x,y)=>x.distance<y.distance?x:y);
      // Evaluate every preview from the same snapshot, including the remembered trail.
      s=M.restore(d.original);M.choose(s,d.depth,best.side);d.t=best.t;set((d.depth+best.t)/M.count(s));
    },
    up(d){held=false;if(d.mode==='trace')view.tween(s.progress,Math.round(s.progress*M.count(s))/M.count(s),set,400);else if(d.t>=.5)view.tween(s.progress,(d.depth+1)/M.count(s),set,350,()=>view.tone(1));else s=M.restore(d.original);},
    cancel(d){held=false;s=M.restore(d.original);},escape(){held=false;}
  });view.start();
})();
</script>
</body></html>
