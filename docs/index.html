<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a1420"><meta name="description" content="A growing collection of wordless, directly manipulable mathematical experiences. Every lesson works offline."><title>Mathematics in Motion</title><style>:root{color-scheme:dark;--bg:#0a1420;--ink:#eedbb6;--aqua:#83d6d1;--line:#648896}*{box-sizing:border-box}html,body{margin:0;min-width:280px;min-height:100%;background:var(--bg)}body{font-family:system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 38%,#142938,#0a1420 70%)}button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #f5e5bb;outline-offset:5px}button svg{width:100%;height:100%;pointer-events:none}svg{display:block}[hidden]{display:none!important}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
#collection{max-width:1060px;margin:auto;min-height:100vh;min-height:100svh;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}.collection-header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.collection-header button{width:46px;height:46px;padding:10px;border-radius:50%;opacity:.72}.collection-header button:hover{background:#83d6d10b;opacity:1}.collection-header button:disabled{opacity:.18;cursor:default}#current-glyph{width:30px;height:30px;opacity:.65}#map-button[aria-expanded=true]{opacity:1;background:#83d6d10b}
#lesson-map{padding:8px 8px 34px;max-width:800px;margin:0 auto}#map-field{position:relative;min-height:320px}#map-links,#map-nodes{position:absolute;inset:0;width:100%;height:100%}#map-links{pointer-events:none;overflow:visible}.lesson-node{position:absolute;width:82px;height:82px;transform:translate(-50%,-50%);padding:18px;border-radius:50%;background:radial-gradient(circle,#173142,#0c1b28 72%);border:1px solid #64889660;transition:border-color .2s,box-shadow .2s,background .2s}.lesson-node:hover{border-color:#83d6d1bb;box-shadow:0 0 32px #83d6d112}.lesson-node.current{border-color:#eedbb6a0;box-shadow:0 0 0 7px #eedbb606}.lesson-node.visited:after{content:"";position:absolute;bottom:7px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:#83d6d1}.lesson-node svg{opacity:.85}#map-paging{display:flex;align-items:center;justify-content:center;gap:25px;margin-top:15px}#map-paging button{width:48px;height:48px;padding:14px}#map-paging button:disabled{opacity:.2}#page-dots{display:flex;gap:8px;align-items:center}#page-dots span{display:block;width:4px;height:4px;border-radius:50%;background:#648896}#page-dots span.active{background:#eedbb6}
#lesson-frame{width:100%;height:calc(100vh - 64px);height:calc(100svh - 64px);min-height:560px;max-height:1000px}#lesson-frame iframe{border:0;display:block;width:100%;height:100%;background:#0a1420;color-scheme:dark}
.scope-control{display:flex;justify-content:center;padding-top:18px}.scope-control button{width:52px;height:52px;padding:12px;border:1px solid #64889655;border-radius:50%;background:#83d6d105}.scope-control button:hover{border-color:#83d6d1aa;background:#83d6d10b}
@media(max-width:420px){.collection-header{padding:0 8px}.lesson-node{width:76px;height:76px;padding:16px}#lesson-map{padding-left:0;padding-right:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body>
<main id="collection">
  <h1 class="sr-only">Mathematics in Motion</h1>
  <header class="collection-header"><button id="map-button" type="button" aria-label="Open the lesson constellation" aria-expanded="true" aria-controls="lesson-map"></button><div id="current-glyph" aria-hidden="true"></div><button id="continue-button" type="button" aria-label="Open a suggested next lesson"></button></header>
  <section id="lesson-map" aria-label="Opening path" aria-describedby="map-description"><p id="map-description" class="sr-only">A small opening path. Each symbol opens a lesson. The constellation control reveals every experience.</p><div id="map-field"><svg id="map-links" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg><nav id="map-nodes" aria-label="Choose a lesson"></nav></div><div id="map-paging" hidden><button id="map-prev" type="button" aria-label="Previous group of lessons"></button><div id="page-dots" aria-hidden="true"></div><button id="map-next" type="button" aria-label="Next group of lessons"></button></div><div class="scope-control"><button id="scope-button" type="button" aria-label="Explore all lessons in the complete constellation"></button></div></section>
  <section id="lesson-frame" aria-label="Current mathematical experience" hidden></section>
  <p id="catalog-status" class="sr-only" aria-live="polite"></p>
</main>
<script>const MotionCatalog=[{"contract":1,"id":"correspondence","title":"Correspondence","summary":"Give every object a partner.","order":0,"builds_on":[],"related":[],"contexts":["sets","relations"],"checks":["../../tests/models.cjs"],"opening_order":0,"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M12 12v22M36 12v22\" stroke=\"#648896\"/>\u003ccircle cx=\"12\" cy=\"10\" r=\"4\" fill=\"#eedbb6\"/>\u003ccircle cx=\"36\" cy=\"10\" r=\"4\" fill=\"#eedbb6\"/>\u003ccircle cx=\"12\" cy=\"36\" r=\"7\" stroke=\"#83d6d1\"/>\u003ccircle cx=\"36\" cy=\"36\" r=\"7\" stroke=\"#83d6d1\"/>\u003c/svg>\n","file":"correspondence.html"},{"contract":1,"id":"membership","title":"Membership","summary":"Discover belonging to one, both, or neither.","order":1,"builds_on":["correspondence"],"related":["same"],"contexts":["sets","logic"],"checks":["../../tests/models.cjs"],"opening_order":1,"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003ccircle cx=\"17\" cy=\"24\" r=\"15\" fill=\"#83d6d1\" fill-opacity=\".06\" stroke=\"#83d6d1\"/>\u003ccircle cx=\"31\" cy=\"24\" r=\"15\" fill=\"#b7a4e8\" fill-opacity=\".06\" stroke=\"#b7a4e8\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"3\" fill=\"#eedbb6\"/>\u003c/svg>\n","file":"membership.html"},{"contract":1,"status":"ready","id":"branch","title":"Branch","summary":"Guide one bead through a fork; discover different journeys with the same arrival.","order":1.5,"builds_on":["correspondence"],"related":["return","through"],"contexts":["choices","paths","equivalence"],"opening_order":2,"interaction_checks":["interaction.test.cjs"],"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\">\u003cpath d=\"M24 7v9C24 26 10 25 10 37M24 16c0 10 14 9 14 21\" fill=\"none\" stroke=\"#648896\" stroke-width=\"1.5\"/>\u003ccircle cx=\"24\" cy=\"7\" r=\"4\" fill=\"#eedbb6\"/>\u003ccircle cx=\"10\" cy=\"39\" r=\"5\" fill=\"none\" stroke=\"#83d6d1\"/>\u003ccircle cx=\"38\" cy=\"39\" r=\"5\" fill=\"none\" stroke=\"#83d6d1\"/>\u003c/svg>\n","file":"branch.html"},{"contract":1,"id":"composition","title":"Composition","summary":"Change what happens by changing the order.","order":2,"builds_on":["correspondence"],"related":["connections"],"contexts":["relations","transformations"],"checks":["../../tests/models.cjs"],"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M9 4v8c0 7 30 3 30 12v20M39 4v8c0 7-30 3-30 12v20M24 4v40\" stroke=\"#83d6d1\" stroke-width=\"1.4\"/>\u003ccircle cx=\"9\" cy=\"4\" r=\"3\" fill=\"#eedbb6\"/>\u003ccircle cx=\"39\" cy=\"44\" r=\"3\" fill=\"#eedbb6\"/>\u003c/svg>\n","file":"composition.html"},{"contract":1,"id":"return","title":"Return","summary":"Turn the shapes and discover when they return together.","order":3,"builds_on":["composition"],"related":["branch","fold","undo"],"contexts":["number-theory","groups","transformations"],"opening_order":3,"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003ccircle cx=\"16\" cy=\"24\" r=\"12\" stroke=\"#83d6d1\"/>\u003ccircle cx=\"35\" cy=\"24\" r=\"8\" stroke=\"#b7a4e8\"/>\u003ccircle cx=\"16\" cy=\"12\" r=\"3\" fill=\"#eedbb6\"/>\u003crect x=\"32\" y=\"29\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#eedbb6\"/>\u003c/svg>\n","file":"return.html"},{"contract":1,"id":"undo","title":"Undo","summary":"Build an operation that restores every input.","order":4,"builds_on":["composition"],"related":["return"],"contexts":["groups","transformations"],"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M9 4v8c0 5 30 5 30 12s-30 7-30 12v8M39 4v8c0 5-30 5-30 12s30 7 30 12v8\" stroke=\"#83d6d1\" stroke-width=\"1.4\"/>\u003ccircle cx=\"9\" cy=\"4\" r=\"3\" fill=\"#eedbb6\"/>\u003ccircle cx=\"9\" cy=\"44\" r=\"4\" stroke=\"#eedbb6\"/>\u003c/svg>\n","file":"undo.html"},{"contract":1,"id":"same","title":"Same","summary":"Make different constructions agree on every input.","order":5,"builds_on":["return","undo"],"related":["membership","through"],"contexts":["logic","groups","representations"],"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"8\" width=\"16\" height=\"11\" rx=\"3\" stroke=\"#83d6d1\"/>\u003crect x=\"3\" y=\"28\" width=\"16\" height=\"11\" rx=\"3\" stroke=\"#b7a4e8\"/>\u003cpath d=\"M11 19v9M19 24h9\" stroke=\"#648896\"/>\u003crect x=\"29\" y=\"9\" width=\"16\" height=\"30\" rx=\"5\" stroke=\"#eedbb6\"/>\u003c/svg>\n","file":"same.html"},{"contract":1,"status":"ready","id":"connections","title":"Connections","summary":"Edit one relationship as connected shapes or a matrix.","order":6,"builds_on":["same"],"related":["composition"],"contexts":["graphs","relations","matrices"],"interaction_checks":["interaction.test.cjs"],"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M7 12 20 29 7 38M7 12v26\" stroke=\"#648896\"/>\u003ccircle cx=\"7\" cy=\"12\" r=\"3\" fill=\"#eedbb6\"/>\u003crect x=\"17\" y=\"26\" width=\"6\" height=\"6\" fill=\"#83d6d1\"/>\u003cpath d=\"m7 35 3 6H4Z\" fill=\"#b7a4e8\"/>\u003cpath d=\"M30 11v28M37 11v28M44 11v28M28 15h18M28 25h18M28 35h18\" stroke=\"#648896\"/>\u003ccircle cx=\"37\" cy=\"15\" r=\"2.6\" fill=\"#eedbb6\"/>\u003ccircle cx=\"44\" cy=\"25\" r=\"2.6\" fill=\"#83d6d1\"/>\u003c/svg>\n","file":"connections.html"},{"contract":1,"status":"ready","id":"through","title":"Through","summary":"Trace every way to connect through an intermediate object.","order":7,"builds_on":["connections","composition"],"related":["branch","same"],"contexts":["relations","matrices","combinatorics"],"interaction_checks":["interaction.test.cjs"],"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"M6 24 24 9 42 24 24 39Z\" stroke=\"#648896\"/>\u003ccircle cx=\"6\" cy=\"24\" r=\"4\" fill=\"#eedbb6\"/>\u003crect x=\"21\" y=\"6\" width=\"6\" height=\"6\" fill=\"#83d6d1\"/>\u003cpath d=\"m24 35 4 7h-8Z\" fill=\"#b7a4e8\"/>\u003ccircle cx=\"42\" cy=\"24\" r=\"5\" stroke=\"#eedbb6\"/>\u003c/svg>\n","file":"through.html"},{"contract":1,"status":"ready","id":"fold","title":"Fold","summary":"Bring hinged square faces into three dimensions.","order":8,"builds_on":["correspondence"],"related":["return"],"contexts":["geometry","spatial-reasoning","transformations"],"interaction_checks":["interaction.test.cjs"],"glyph":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\u003cpath d=\"m24 5 17 10v20L24 45 7 35V15ZM7 15l17 10 17-10M24 25v20\" stroke=\"#83d6d1\" stroke-width=\"1.2\"/>\u003ccircle cx=\"24\" cy=\"25\" r=\"3\" fill=\"#eedbb6\"/>\u003c/svg>\n","file":"fold.html"}];const MotionPayloads=null;</script>
<script>/* Pure catalog policy. Relationships are suggestions, never access locks. */
const CatalogModel = (() => {
  function ordered(catalog){
    const output=[],seen=new Set();
    function visit(item){if(seen.has(item.id))return;seen.add(item.id);for(const id of item.builds_on)visit(catalog.find(x=>x.id===id));output.push(item);}
    for(const item of [...catalog].sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id)))visit(item);
    return output;
  }
  function layout(catalog,page,width){
    const entries=ordered(catalog).slice(page*9,page*9+9),ids=new Set(entries.map(x=>x.id)),depth=new Map(),rows=[],columns=width<360?2:3;
    for(const item of entries){let d=Math.max(-1,...item.builds_on.filter(id=>ids.has(id)).map(id=>depth.get(id)??0))+1;while((rows[d]?.length||0)>=columns)d++;(rows[d]??=[]).push(item);depth.set(item.id,d);}
    const nodes=[];rows.forEach((row,d)=>row.forEach((item,i)=>nodes.push({id:item.id,x:width*(i+1)/(row.length+1),y:66+d*114})));
    const height=Math.max(320,132+(rows.length-1)*114),byId=new Map(nodes.map(n=>[n.id,n])),edges=[];
    for(const item of entries){for(const from of item.builds_on)if(ids.has(from))edges.push({from,to:item.id,type:'builds_on'});for(const other of item.related)if(ids.has(other)&&item.id<other)edges.push({from:item.id,to:other,type:'related'});}
    return{nodes,edges,height,byId,pages:Math.ceil(catalog.length/9)};
  }
  function opening(catalog){const marked=catalog.filter(x=>Number.isInteger(x.opening_order));return marked.length?[...marked].sort((a,b)=>a.opening_order-b.opening_order):ordered(catalog).slice(0,4);}
  function openingLayout(catalog,width){
    const entries=opening(catalog),offset=Math.min(58,(width-152)/2),nodes=entries.map((item,i)=>({id:item.id,x:width/2+(i%2?offset:-offset),y:66+i*114}));
    return{nodes,edges:nodes.slice(1).map((n,i)=>({from:nodes[i].id,to:n.id,type:'opening'})),height:Math.max(320,132+(nodes.length-1)*114),byId:new Map(nodes.map(n=>[n.id,n])),pages:1};
  }
  function next(catalog,active){const path=opening(catalog);if(!active)return path[0]||null;const i=path.findIndex(x=>x.id===active);if(i>=0)return path[i+1]||null;return ordered(catalog).find(x=>x.builds_on.includes(active)&&!path.some(p=>p.id===x.id))||null;}
  return{ordered,layout,opening,openingLayout,next};
})();
if(typeof module!=='undefined')module.exports=CatalogModel;
</script>
<script>(() => {
  const $=id=>document.getElementById(id),channel='mathematics-in-motion/v1';
  const catalog=MotionCatalog,byId=new Map(catalog.map(x=>[x.id,x]));
  const states=new Map(),visited=new Set();let active=null,frame=null,page=0,mapOpen=true,scope='opening',operation=0,requestId=0;
  const pending=new Map();
  const art=body=>`<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;
  const nextIcon=art('<path d="m15 9 11 11-11 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>');
  const atlasIcon=art('<path d="M20 7 8 29M20 7 32 29M8 29h24" stroke="#648896"/><circle cx="20" cy="7" r="4" fill="#0a1420" stroke="#eedbb6"/><circle cx="8" cy="29" r="4" fill="#0a1420" stroke="#83d6d1"/><circle cx="32" cy="29" r="4" fill="#0a1420" stroke="#b7a4e8"/>');
  const pathIcon=art('<path d="M14 7c0 7 12 6 12 13s-12 6-12 13" stroke="#648896"/><circle cx="14" cy="7" r="3" fill="#eedbb6"/><circle cx="26" cy="20" r="3" fill="#83d6d1"/><circle cx="14" cy="33" r="3" fill="#b7a4e8"/>');
  $('map-button').innerHTML=atlasIcon;
  $('continue-button').innerHTML=nextIcon;$('map-next').innerHTML=nextIcon;$('map-prev').innerHTML=art('<path d="m25 9-11 11 11 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>');
  try{const saved=JSON.parse(localStorage.getItem('motion-visits-v1')||'[]');if(Array.isArray(saved))saved.filter(id=>byId.has(id)).forEach(id=>visited.add(id));}catch{}
  function persist(){try{localStorage.setItem('motion-visits-v1',JSON.stringify([...visited]));}catch{}}
  const nextLesson=()=>CatalogModel.next(catalog,active);
  function updateChrome(){const next=nextLesson();$('current-glyph').innerHTML=active?byId.get(active).glyph:'';$('continue-button').disabled=false;$('continue-button').innerHTML=next?nextIcon:atlasIcon;$('continue-button').setAttribute('aria-label',next?`Explore ${next.title}`:'Explore the complete lesson constellation');$('map-button').disabled=mapOpen&&!active;$('map-button').setAttribute('aria-expanded',String(mapOpen));$('map-button').setAttribute('aria-label',mapOpen&&active?'Return to the current lesson':'Open the lesson menu');$('scope-button').innerHTML=scope==='opening'?atlasIcon:pathIcon;$('scope-button').setAttribute('aria-label',scope==='opening'?'Explore all lessons in the complete constellation':'Return to the small opening path');}
  function drawMap(){
    const w=Math.max(264,$('map-field').getBoundingClientRect().width),g=scope==='opening'?CatalogModel.openingLayout(catalog,w):CatalogModel.layout(catalog,page,w);
    $('lesson-map').setAttribute('aria-label',scope==='opening'?'Opening path':'Complete lesson constellation');
    $('map-description').textContent=scope==='opening'?'A small suggested path through familiar actions. Each symbol opens a lesson. The constellation control reveals every lesson, all available immediately. A visit is not an assessment.':'Solid paths suggest what builds on what; dotted paths connect related ideas. Every lesson is available. Use the path control to return to the small opening sequence.';
    $('map-field').style.height=`${g.height}px`;$('map-links').setAttribute('viewBox',`0 0 ${w} ${g.height}`);
    $('map-links').innerHTML=g.edges.map(e=>{const a=g.byId.get(e.from),b=g.byId.get(e.to);return `<path d="M${a.x} ${a.y} C${a.x} ${(a.y+b.y)/2} ${b.x} ${(a.y+b.y)/2} ${b.x} ${b.y}" fill="none" stroke="${e.type==='related'?'#b7a4e8':'#648896'}" stroke-opacity="${e.type==='related'?'.28':'.5'}" stroke-width="1.2" ${e.type==='related'?'stroke-dasharray="2 7"':''}/>`;}).join('');
    const old=new Map([...$('map-nodes').children].map(n=>[n.dataset.lesson,n])),keep=new Set();
    for(const p of g.nodes){const item=byId.get(p.id);let b=old.get(p.id);if(!b){b=document.createElement('button');b.type='button';b.dataset.lesson=p.id;b.innerHTML=item.glyph;b.addEventListener('click',()=>openLesson(item.id));$('map-nodes').appendChild(b);}keep.add(p.id);b.style.left=`${p.x}px`;b.style.top=`${p.y}px`;b.className=`lesson-node${active===p.id?' current':''}${visited.has(p.id)?' visited':''}`;b.setAttribute('aria-label',`${item.title}. ${item.summary}${visited.has(p.id)?' Previously visited.':''}`);b.setAttribute('aria-current',active===p.id?'page':'false');}
    for(const [id,b] of old)if(!keep.has(id))b.remove();
    $('map-paging').hidden=g.pages<=1;$('map-prev').disabled=page===0;$('map-next').disabled=page===g.pages-1;$('page-dots').innerHTML=Array.from({length:g.pages},(_,i)=>`<span class="${i===page?'active':''}"></span>`).join('');updateChrome();
  }
  function pauseCurrent(){
    if(!frame)return Promise.resolve();
    const request=++requestId;
    return new Promise(resolve=>{
      const timeout=setTimeout(()=>{pending.delete(request);resolve();},180);
      pending.set(request,()=>{clearTimeout(timeout);resolve();});
      frame.contentWindow.postMessage({channel,type:'pause',request},'*');
    });
  }
  function setHash(hash,replace=false){try{history[replace?'replaceState':'pushState'](null,'',hash);}catch{location.hash=hash;}}
  async function openLesson(id,updateUrl=true){
    if(!byId.has(id))return;const ticket=++operation;
    await pauseCurrent();if(ticket!==operation)return;
    if(active!==id||!frame){
      frame?.remove();active=id;frame=document.createElement('iframe');frame.title=`${byId.get(id).title} — Mathematics in Motion`;frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.setAttribute('allow','fullscreen');
      if(MotionPayloads)frame.srcdoc=MotionPayloads[id];else frame.src=byId.get(id).file;
      $('lesson-frame').appendChild(frame);
    }
    if(!CatalogModel.opening(catalog).some(x=>x.id===id))scope='all';
    mapOpen=false;$('lesson-map').hidden=true;$('lesson-frame').hidden=false;visited.add(id);persist();updateChrome();
    if(updateUrl)setHash(`#${id}`);$('catalog-status').textContent=`${byId.get(id).title} opened.`;frame.focus({preventScroll:true});
  }
  async function openMap(updateUrl=true,requestedScope=null){
    const ticket=++operation;await pauseCurrent();if(ticket!==operation)return;
    if(requestedScope)scope=requestedScope;
    mapOpen=true;$('lesson-frame').hidden=true;$('lesson-map').hidden=false;
    page=scope==='all'&&active?Math.floor(CatalogModel.ordered(catalog).findIndex(x=>x.id===active)/9):0;
    drawMap();if(updateUrl)setHash(scope==='opening'?'#start':'#map');
    const focus=[...$('map-nodes').children].find(b=>b.dataset.lesson===active)||$('map-nodes').children[0];focus?.focus({preventScroll:true});
  }
  window.addEventListener('message',event=>{
    if(!frame||event.source!==frame.contentWindow||event.data?.channel!==channel||event.data.lesson!==active)return;
    const data=event.data;
    if(data.type==='ready')frame.contentWindow.postMessage({channel,type:'restore',state:states.get(active)||null},'*');
    if((data.type==='state'||data.type==='paused')&&data.state&&typeof data.state==='object')states.set(active,data.state);
    if(data.type==='paused'){pending.get(data.request)?.();pending.delete(data.request);}
  });
  $('map-button').addEventListener('click',()=>{if(mapOpen&&active)openLesson(active);else openMap();});
  $('continue-button').addEventListener('click',()=>{const next=nextLesson();if(next)openLesson(next.id);else openMap(true,'all');});
  $('scope-button').addEventListener('click',()=>openMap(true,scope==='opening'?'all':'opening'));
  $('map-prev').addEventListener('click',()=>{if(page>0){page--;drawMap();}});$('map-next').addEventListener('click',()=>{if((page+1)*9<catalog.length){page++;drawMap();}});
  function route(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch{}if(byId.has(id))openLesson(id,false);else openMap(false,id==='map'?'all':'opening');}
  window.addEventListener('hashchange',route);window.addEventListener('popstate',route);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseCurrent();});
  new ResizeObserver(()=>{if(mapOpen)drawMap();}).observe($('map-field'));
  route();
})();
</script>
</body></html>
