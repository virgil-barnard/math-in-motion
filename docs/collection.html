er('pointermove',event=>{\n    if(!drag || event.pointerId!==drag.pointer)return;\n    const distance=Math.hypot(event.clientX-drag.start.x,event.clientY-drag.start.y);\n    if(!drag.moved&&distance\u003c6)return;\n    if(!drag.moved){\n      transition=null;drag.moved=true;\n      if(current==='pairing')rebasePairing();\n      if(current==='membership')M.rebaseMembers(state,width,height);\n      state.selected=drag.kind==='token'?drag.id:state.selected;\n      syncRange();\n    }\n    const p=normalized(event);\n    drag.pos=drag.kind==='gate'?{x:.5,y:M.clamp(drag.origin.y+(event.clientY-drag.start.y)/height,.22,.72)}:p;\n    hint=null;render();\n  });\n  objects.addEventListener('pointercancel',event=>{if(drag?.pointer===event.pointerId)cancelDrag();});\n  objects.addEventListener('lostpointercapture',event=>{if(drag?.pointer===event.pointerId)cancelDrag();});\n  objects.addEventListener('pointerup',event=>{\n    if(!drag || event.pointerId!==drag.pointer)return;\n    const ended=drag;drag=null;\n    try{ended.button.releasePointerCapture(ended.pointer);}catch{}\n    if(!ended.moved)return;\n    suppressClick=ended.key;\n    const from=new Map(lastPositions), p=ended.pos;\n    if(current==='pairing') {\n      const token=state.tokens.find(t=>t.id===ended.id);\n      const target=state.sockets.reduce((best,s)=>{const d=Math.hypot((s.x-p.x)*width,(s.y-p.y)*height);return !best||d\u003cbest.d?{s,d}:best;},null);\n      if(p.y>.82&&(state.seed>=2||!token.active)){M.putAway(state,token.id);pulse(.5,.88,LINE);tone(0);}\n      else if(target&&target.d\u003c36&&M.connect(state,token.id,target.s.id)){token.x=p.x;token.y=Math.min(p.y,.45);state.progress=1;pulse(target.s.x,target.s.y);tone(token.id);}\n      else {token.active=true;token.x=p.x;token.y=p.y;state.progress=0;if(target&&target.d\u003c36)pulse(target.s.x,target.s.y,GOLD);}\n      beginTransition(from,330);\n    } else if(current==='membership') {\n      const token=state.tokens.find(t=>t.id===ended.id); token.x=p.x;token.y=p.y;\n      const region=M.regionAt(p.x,p.y,width,height),expected=M.regionOf(token);\n      if(region===expected){\n        const collision=state.tokens.some(t=>t.id!==token.id&&Math.hypot((t.x-token.x)*width,(t.y-token.y)*height)\u003c34);\n        if(collision)Object.assign(token,M.memberTarget(state,token,width,height));\n        state.selected=null;pulse(token.x,token.y,region===1?AQUA:region===2?VIOLET:GOLD);tone(region);\n      }else{hint={region:expected,until:performance.now()+1400};state.selected=token.id;requestFrame();}\n      beginTransition(from,240);\n    } else {\n      const slot=state.gates.findIndex(g=>g.id===ended.id),other=slot===0?p.y>.47:p.y\u003c.47;\n      if(other)changeGates(()=>M.swapGates(state));else beginTransition(from,280);\n    }\n    updateSummary();\n  });\n  objects.addEventListener('click',event=>{\n    const button=event.target.closest('button[data-key]');if(!button)return;\n    const key=button.dataset.key;\n    if(event.detail>0&&suppressClick===key){suppressClick='';return;}suppressClick='';\n    const type=button.dataset.kind,id=Number(key.split('-')[1]);\n    stop();\n    if(type==='token'){\n      state.selected=state.selected===id?null:id;hint=null;render();\n      announce(state.selected===null?'Selection cleared.':button.getAttribute('aria-label')+' Selected.');return;\n    }\n    if(current==='pairing'&&state.selected!==null&&(type==='target'||type==='reserve')){\n      const from=new Map(lastPositions),selected=state.selected;\n      if(type==='reserve'){M.putAway(state,selected);pulse(.5,.88,LINE);}\n      else if(M.connect(state,selected,id)){state.progress=1;const target=state.sockets.find(s=>s.id===id);pulse(target.x,target.y);tone(selected);}\n      else {const target=state.sockets.find(s=>s.id===id);pulse(target.x,target.y,GOLD);announce('This ring already has a partner. Choose an empty ring.');}\n      beginTransition(from);updateSummary();\n    }else if(current==='membership'&&type==='region'&&state.selected!==null){\n      const from=new Map(lastPositions);M.rebaseMembers(state,width,height);\n      const token=state.tokens.find(t=>t.id===state.selected);\n      Object.assign(token,id===M.regionOf(token)?M.memberTarget(state,token,width,height):M.regionAnchor(id,width,height));\n      if(id===M.regionOf(token)){state.selected=null;hint=null;pulse(token.x,token.y);tone(id);}\n      else {hint={region:M.regionOf(token),until:performance.now()+1400};requestFrame();}\n      beginTransition(from);updateSummary();\n    }else if(current==='composition'&&type==='gate')changeGates(()=>M.toggleGate(state,id));\n    else if(current==='composition'&&type==='target'){\n      state.predictions[state.selected??0]=id;pulse([.22,.5,.78][id],.82,colors[state.selected??0]);render();announce(`Prediction placed at output ${id+1}. Play or scrub to inspect the actual route.`);\n    }\n  });\n  window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();state.selected=null;hint=null;render();announce('Selection cleared.');}});\n  function resize(){\n    if(drag)cancelDrag();\n    const rect=stage.getBoundingClientRect();width=Math.max(240,rect.width);height=Math.max(320,rect.height);\n    scene.setAttribute('viewBox',`0 0 ${width} ${height}`);lastScene='';transition=null;render();\n  }\n  if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);\n  document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();cancelDrag();}});\n  choose(current,false);\n  if(typeof MotionBridge!=='undefined')MotionBridge.connect({\n    snapshot:()=>({version:1,kind:current,state:JSON.parse(JSON.stringify(state))}),\n    restore(value){\n      if(value?.version!==1||value.kind!==current||value.state?.kind!==current||!Number.isInteger(value.state.seed)||value.state.seed\u003c0||!Number.isFinite(value.state.progress)||value.state.progress\u003c0||value.state.progress>1)return;\n      // Same-document snapshots are kept only in the trusted catalog's memory.\n      stop();cancelDrag();worlds[current]=JSON.parse(JSON.stringify(value.state));state=worlds[current];choose(current,false);\n    },\n    pause(){stop();cancelDrag();transition=null;pulses=[];hint=null;if(audioEnabled){audioEnabled=false;audioContext?.suspend();sound.innerHTML=icons.silent;sound.setAttribute('aria-pressed','false');sound.setAttribute('aria-label','Enable optional sound');}render();}\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","branch":"\u003c!doctype html>\n\u003chtml lang=\"en\" data-lesson=\"branch\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#0a1420\">\u003ctitle>Branch \u00b7 Mathematics in Motion\u003c/title>\u003cstyle>:root{color-scheme:dark;--bg:#0a1420;--ink:#eedbb6;--aqua:#83d6d1;--violet:#b7a4e8;--line:#648896;--soft:#aec4cb}\n*{box-sizing:border-box}html,body{margin:0;min-width:280px;min-height:100%;background:var(--bg)}body{color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 35%,#152c3b, #0a1420 70%);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}button:focus-visible,input:focus-visible{outline:2px solid #f5e5bb;outline-offset:4px}button svg{width:100%;height:100%;pointer-events:none}svg{display:block}button:active{filter:brightness(1.2)}[hidden]{display:none!important}\n.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}\n#lesson-app{width:min(100%,1000px);height:100vh;height:100svh;min-height:570px;max-height:1000px;margin:auto;display:grid;grid-template-rows:64px minmax(370px,1fr) 132px;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}\n.lesson-header{display:flex;align-items:center;justify-content:center;position:relative}.lesson-glyph{width:34px;height:34px;opacity:.75}.lesson-header #sound{position:absolute;right:0;width:46px;height:46px;padding:13px;opacity:.6;border-radius:50%}.lesson-header #sound[aria-pressed=true]{opacity:1}\n#stage{position:relative;min-height:370px;isolation:isolate}#scene,#objects{position:absolute;inset:0;width:100%;height:100%}#scene{pointer-events:none;overflow:visible}#objects{pointer-events:none}.piece{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;z-index:2;cursor:grab}.piece svg{width:44px;height:44px;filter:drop-shadow(0 0 9px #eedbb61a)}.piece:hover{background:#83d6d10b}.piece:active,.piece.dragging{cursor:grabbing;background:#eedbb610}.piece.choice{width:64px;height:56px;border-radius:14px;cursor:pointer;background:#83d6d108;border:1px solid #64889655}.piece.choice[aria-pressed=true]{border-color:#eedbb6aa;background:#eedbb60d}.piece.choice svg{width:48px;height:42px;filter:none}.piece.gate-target{width:78%;height:70px;border-radius:15px;background:transparent;z-index:1}\n.lesson-footer{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 max(8px,5%)}.transport{display:flex;align-items:center;gap:18px}.round-control{width:48px;height:48px;flex:none;border:1px solid #afc3ca40;border-radius:50%;padding:15px;background:#83d6d108}.quiet-control{width:46px;height:46px;flex:none;border-radius:50%;padding:13px;opacity:.7}.quiet-control:hover{background:#83d6d10d;opacity:1}.tools{display:flex;align-items:center;justify-content:center;gap:22px}.example-progress{display:flex;gap:10px;min-width:80px;justify-content:center;align-items:center}.example-dot{width:4px;height:4px;border-radius:50%;background:#64889666}.example-dot.active{background:var(--ink);box-shadow:0 0 0 3px #eedbb619}\ninput[type=range]{width:100%;min-width:0;height:48px;margin:0;background:transparent;accent-color:var(--aqua);cursor:ew-resize}\n.embedded #lesson-app{grid-template-rows:42px minmax(370px,1fr) 128px;min-height:540px}.embedded .lesson-glyph{opacity:.35;width:26px;height:26px}\n@media(max-width:560px){#lesson-app{padding-left:10px;padding-right:10px}.lesson-footer{padding:0 12px}.transport{gap:12px}}\n@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}\n\n.piece.branch-traveler{width:64px;height:64px;z-index:4}.piece.branch-traveler svg{width:60px;height:60px;filter:drop-shadow(0 0 12px #eedbb619)}.piece.branch-choice{width:56px;height:56px;z-index:2;cursor:pointer}.piece.branch-choice svg{width:52px;height:52px;filter:none}.piece.branch-home{width:56px;height:56px;cursor:pointer;z-index:2}.piece.branch-home svg{width:48px;height:48px;filter:none}\ninput[type=range]:disabled{opacity:.28;cursor:default}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cmain id=\"lesson-app\">\n  \u003ch1 id=\"lesson-title\" class=\"sr-only\">\u003c/h1>\n  \u003cheader class=\"lesson-header\">\u003cdiv id=\"lesson-glyph\" class=\"lesson-glyph\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"sound\" type=\"button\" aria-label=\"Enable optional sound\" aria-pressed=\"false\">\u003c/button>\u003c/header>\n  \u003csection id=\"stage\" aria-labelledby=\"lesson-title\" aria-describedby=\"lesson-description\">\u003csvg id=\"scene\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003c/svg>\u003cdiv id=\"objects\">\u003c/div>\u003c/section>\n  \u003cfooter class=\"lesson-footer\">\n    \u003cdiv class=\"transport\">\u003cbutton id=\"play\" class=\"round-control\" type=\"button\" aria-label=\"Play the transformation\">\u003c/button>\u003clabel for=\"timeline\" class=\"sr-only\">Inspect the transformation\u003c/label>\u003cinput id=\"timeline\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"0\">\u003cbutton id=\"rewind\" class=\"quiet-control\" type=\"button\" aria-label=\"Return to the beginning\">\u003c/button>\u003c/div>\n    \u003cdiv class=\"tools\">\u003cdiv id=\"example-progress\" class=\"example-progress\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"example\" class=\"quiet-control\" type=\"button\" aria-label=\"Explore another example\">\u003c/button>\u003c/div>\n  \u003c/footer>\n  \u003cp id=\"lesson-description\" class=\"sr-only\">\u003c/p>\u003cp id=\"status\" class=\"sr-only\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\n\u003c/main>\n\n\u003cscript>/* Portable document contract v1. Parent identity is checked; no network access. */\nconst MotionBridge = (() => {\n  const channel = 'mathematics-in-motion/v1';\n  let hooks = null;\n  const lesson = document.documentElement.dataset.lesson;\n  const embedded = window.parent !== window;\n  if (embedded) document.documentElement.classList.add('embedded');\n  function send(type, extra = {}) {\n    if (embedded) window.parent.postMessage({channel, lesson, type, ...extra}, '*');\n  }\n  function changed() { if (hooks) send('state', {state: hooks.snapshot()}); }\n  window.addEventListener('message', event => {\n    if (!embedded || event.source !== window.parent || event.data?.channel !== channel || !hooks) return;\n    const data = event.data;\n    if (data.type === 'restore') {\n      if (data.state) hooks.restore(data.state);\n      changed();\n    } else if (data.type === 'pause') {\n      hooks.pause();\n      send('paused', {request: data.request, state: hooks.snapshot()});\n    }\n  });\n  return {\n    connect(value) { hooks = value; send('ready'); },\n    changed,\n    explored() { send('explored'); }\n  };\n})();\n\u003c/script>\n\u003cscript>/* Small optional author kit. Lessons own models, state, geometry, and gestures. */\nconst MotionKit = (() => {\n  const C = ['#eedbb6','#83d6d1','#b7a4e8','#d8a78b'];\n  const shapes = ['circle','square','triangle','diamond'];\n  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));\n  const smooth = x => x*x*(3-2*x);\n  const f = x => Number(x).toFixed(3);\n  const svg = body => `\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">${body}\u003c/svg>`;\n  function shape(kind,x,y,r,color=C[0],filled=true,opacity=1) {\n    const a=`fill=\"${filled?color:'none'}\" stroke=\"${color}\" stroke-width=\"${filled?.7:1.2}\" opacity=\"${opacity}\" stroke-linejoin=\"round\"`;\n    if(kind==='circle')return `\u003ccircle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"${r}\" ${a}/>`;\n    if(kind==='square')return `\u003crect x=\"${f(x-r)}\" y=\"${f(y-r)}\" width=\"${2*r}\" height=\"${2*r}\" rx=\"2.5\" ${a}/>`;\n    if(kind==='triangle')return `\u003cpath d=\"M${f(x)} ${f(y-r*1.15)}L${f(x+r)} ${f(y+r*.8)}L${f(x-r)} ${f(y+r*.8)}Z\" ${a}/>`;\n    return `\u003cpath d=\"M${f(x)} ${f(y-r*1.2)}L${f(x+r)} ${f(y)}L${f(x)} ${f(y+r*1.2)}L${f(x-r)} ${f(y)}Z\" ${a}/>`;\n  }\n  const icons={\n    play:svg('\u003cpath d=\"m18 10 20 14-20 14Z\" fill=\"currentColor\"/>'),\n    pause:svg('\u003cpath d=\"M18 12v24M30 12v24\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>'),\n    rewind:svg('\u003cpath d=\"M12 12a16 16 0 1 1-3 20M12 3v11H2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'),\n    example:svg('\u003crect x=\"5\" y=\"5\" width=\"27\" height=\"27\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" opacity=\".45\"/>\u003crect x=\"16\" y=\"16\" width=\"27\" height=\"27\" rx=\"8\" fill=\"#102230\" stroke=\"currentColor\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"2\" fill=\"currentColor\"/>\u003ccircle cx=\"35\" cy=\"35\" r=\"2\" fill=\"currentColor\"/>'),\n    silent:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM33 18l10 12M43 18 33 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>'),\n    sound:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM32 17q7 7 0 14M38 10q13 14 0 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>')\n  };\n  function create(spec) {\n    const $=id=>document.getElementById(id);\n    const stage=$('stage'),scene=$('scene'),objects=$('objects'),range=$('timeline'),play=$('play');\n    let w=640,h=500,frame=0,animation=null,drag=null,suppress=null,lastStatus='';\n    let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let audio=null,enabled=false;\n    const buttons=new Map();\n    $('lesson-title').textContent=spec.title;\n    $('lesson-description').textContent=spec.description;\n    $('lesson-glyph').innerHTML=spec.glyph;\n    $('rewind').innerHTML=icons.rewind;$('example').innerHTML=icons.example;$('sound').innerHTML=icons.silent;\n    function announce(text) {if(text!==lastStatus){$('status').textContent=text;lastStatus=text;}}\n    function stop(){animation=null;cancelAnimationFrame(frame);frame=0;play.innerHTML=icons.play;play.setAttribute('aria-label','Play the transformation');}\n    function paint(body,items=[]) {\n      scene.innerHTML=body;\n      const seen=new Set();\n      for(const item of items){\n        seen.add(item.key);let b=buttons.get(item.key);\n        if(!b){b=document.createElement('button');b.type='button';b.dataset.key=item.key;objects.appendChild(b);buttons.set(item.key,b);}\n        b.className=`piece ${item.kind||'token'}${drag?.key===item.key?' dragging':''}`;\n        b.style.left=`${item.x}px`;b.style.top=`${item.y}px`;\n        b.setAttribute('aria-label',item.label);\n        if(item.selected!==undefined)b.setAttribute('aria-pressed',String(item.selected));\n        const art=item.art??svg(shape(item.shape||'circle',24,24,11,item.color||C[0]));\n        if(b.dataset.art!==art){b.innerHTML=art;b.dataset.art=art;}\n      }\n      for(const [key,b] of buttons)if(!seen.has(key)){b.remove();buttons.delete(key);}\n    }\n    function render(){spec.render(api);range.value=String(clamp(spec.progress())*1000);range.setAttribute('aria-valuetext',spec.describe());}\n    function changed(){announce(spec.describe());MotionBridge.changed();}\n    function tone(index=0){\n      if(!enabled||!audio)return;\n      const time=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();\n      osc.frequency.value=[261.63,329.63,392,523.25][Math.abs(index)%4];\n      gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.045,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+.38);\n      osc.connect(gain);gain.connect(audio.destination);osc.start(time);osc.stop(time+.4);osc.onended=()=>{osc.disconnect();gain.disconnect();};\n    }\n    function tween(from,to,setter,duration=600,after=null){\n      stop();\n      if(reduced||Math.abs(to-from)\u003c1e-8){setter(to);render();after?.();changed();return;}\n      animation={from,to,setter,start:performance.now(),duration,after};\n      play.innerHTML=icons.pause;play.setAttribute('aria-label','Pause the transformation');\n      const tick=now=>{\n        if(!animation)return;const a=animation,t=clamp((now-a.start)/a.duration);\n        a.setter(t===1?a.to:a.from+(a.to-a.from)*smooth(t));render();\n        if(t===1){stop();a.after?.();changed();}else frame=requestAnimationFrame(tick);\n      };frame=requestAnimationFrame(tick);\n    }\n    function cancelDrag(){if(!drag)return;const old=drag;drag=null;spec.cancel?.(old);try{old.button.releasePointerCapture(old.pointer);}catch{}render();}\n    function point(event){const r=stage.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top};}\n    objects.addEventListener('pointerdown',event=>{\n      const button=event.target.closest('button[data-key]');if(!button||drag||event.button!==0)return;\n      stop();suppress=null;const p=point(event),key=button.dataset.key;\n      const detail=spec.down?.(key,p);if(!detail)return;\n      drag={...detail,key,button,pointer:event.pointerId,start:p,moved:false};\n      button.setPointerCapture(event.pointerId);render();\n    });\n    objects.addEventListener('pointermove',event=>{\n      if(!drag||drag.pointer!==event.pointerId)return;const p=point(event);\n      if(!drag.moved&&Math.hypot(p.x-drag.start.x,p.y-drag.start.y)\u003c3)return;\n      drag.moved=true;spec.move?.(drag,p);render();\n    });\n    objects.addEventListener('pointerup',event=>{\n      if(!drag||drag.pointer!==event.pointerId)return;const ended=drag;drag=null;\n      try{ended.button.releasePointerCapture(ended.pointer);}catch{}\n      if(ended.moved){suppress=ended.key;spec.up?.(ended,point(event));render();changed();MotionBridge.explored();}\n    });\n    for(const name of ['pointercancel','lostpointercapture'])objects.addEventListener(name,event=>{if(drag?.pointer===event.pointerId){cancelDrag();changed();}});\n    objects.addEventListener('click',event=>{\n      const button=event.target.closest('button[data-key]');if(!button)return;\n      if(event.detail>0&&suppress===button.dataset.key){suppress=null;return;}\n      suppress=null;stop();spec.activate?.(button.dataset.key);render();changed();MotionBridge.explored();\n    });\n    objects.addEventListener('keydown',event=>{\n      const button=event.target.closest('button[data-key]');if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      if(spec.nudge){event.preventDefault();cancelDrag();stop();spec.nudge(button.dataset.key,['ArrowRight','ArrowUp'].includes(event.key)?1:-1,event.key);render();changed();}\n    });\n    play.addEventListener('click',()=>{cancelDrag();if(animation){stop();changed();return;}spec.play();render();MotionBridge.explored();});\n    $('rewind').addEventListener('click',()=>{cancelDrag();stop();spec.rewind();render();changed();});\n    $('example').addEventListener('click',()=>{cancelDrag();stop();spec.example();render();changed();tone(2);});\n    range.addEventListener('input',()=>{const p=Number(range.value)/1000;cancelDrag();stop();spec.scrub(p);render();});\n    range.addEventListener('change',()=>{spec.settle?.();render();changed();MotionBridge.explored();});\n    range.addEventListener('keydown',event=>{\n      if(!spec.step||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      event.preventDefault();cancelDrag();stop();spec.step(['ArrowRight','ArrowUp'].includes(event.key)?1:-1);render();changed();\n    });\n    $('sound').addEventListener('click',async()=>{\n      if(enabled){enabled=false;audio?.suspend();}else{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){announce('Optional sound is unavailable.');return;}try{audio||=new Audio();await audio.resume();enabled=true;tone(0);}catch{announce('Optional sound could not start.');return;}}\n      $('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Mute optional sound':'Enable optional sound');$('sound').innerHTML=icons[enabled?'sound':'silent'];\n    });\n    function pause(){cancelDrag();stop();if(enabled){enabled=false;audio?.suspend();$('sound').innerHTML=icons.silent;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable optional sound');}}\n    function resize(){cancelDrag();const r=stage.getBoundingClientRect();w=Math.max(260,r.width);h=Math.max(370,r.height);scene.setAttribute('viewBox',`0 0 ${w} ${h}`);render();}\n    const api={get w(){return w;},get h(){return h;},get reduced(){return reduced;},paint,render,tween,stop,changed,tone,announce,\n      examples(index,count){$('example-progress').innerHTML=Array.from({length:count},(_,i)=>`\u003cspan class=\"example-dot${i===index?' active':''}\">\u003c/span>`).join('');},\n      start(){stop();new ResizeObserver(resize).observe(stage);resize();MotionBridge.connect({snapshot:spec.snapshot,restore(value){pause();spec.restore(value);render();},pause});}\n    };\n    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();changed();}});\n    window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();stop();spec.escape?.();render();changed();}});\n    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduced=event.matches;if(reduced){pause();spec.settle?.();render();changed();}});\n    return api;\n  }\n  return {C,shapes,clamp,smooth,f,svg,shape,create};\n})();\n\u003c/script>\n\u003cscript>/* A journey is an ordered word of left/right choices, not a random trial. */\nconst BranchModel = (() => {\n  const count=s=>1+s.seed%3;\n  const create=(seed=0)=>({version:1,seed,route:[],progress:0,reference:null,record:null});\n  const arrival=route=>route.reduce((sum,side)=>sum+side,0);\n  function vertices(route){let k=0;return [{row:0,slot:0},...route.map((side,i)=>({row:i+1,slot:k+=side}))];}\n  function choose(s,depth,side){\n    if(!Number.isInteger(depth)||depth\u003c0||depth>=count(s)||depth>s.route.length||(side!==0&&side!==1))return false;\n    if(s.record)s.reference=s.record.slice();\n    s.route=s.route.slice(0,depth).concat(side);s.progress=depth/count(s);return true;\n  }\n  function inspect(s,p){s.progress=Math.max(0,Math.min(s.route.length/count(s),p));if(s.progress===1)s.record=s.route.slice();}\n  function plan(s){while(s.route.length\u003ccount(s))s.route.push(s.route.length%2);}\n  function relation(s){if(!s.reference||s.route.length!==count(s)||s.progress!==1)return null;return s.route.every((x,i)=>x===s.reference[i])?'same-route':arrival(s.route)===arrival(s.reference)?'same-arrival':'different-arrival';}\n  function restore(v){\n    if(v?.version!==1||!Number.isSafeInteger(v.seed)||v.seed\u003c0)return create();const n=count(v);\n    const bits=a=>Array.isArray(a)&&a.every(x=>x===0||x===1),full=a=>a===null||bits(a)&&a.length===n;\n    if(!bits(v.route)||v.route.length>n||!Number.isFinite(v.progress)||v.progress\u003c0||v.progress>v.route.length/n||!full(v.reference)||!full(v.record))return create();\n    return{version:1,seed:v.seed,route:v.route.slice(),progress:v.progress,reference:v.reference?.slice()??null,record:v.record?.slice()??null};\n  }\n  return{create,count,arrival,vertices,choose,inspect,plan,relation,restore};\n})();\nif(typeof module!=='undefined')module.exports=BranchModel;\n\u003c/script>\n\u003cscript>/* Pixel geometry for a triangular lattice of repeated equal steps. */\nconst BranchGeometry = (() => {\n  function layout(n,w,h){const dx=Math.min(120,(w-80)/(2*n)),dy=Math.min(180,(h-136)/n),top=h*.46-dy*n/2;return{n,w,h,dx,dy,point:(row,slot)=>({x:w/2+(2*slot-row)*dx,y:top+row*dy})};}\n  function point(a,b,t){const q=1-t;return{x:a.x+(b.x-a.x)*(3*t*t-2*t*t*t),y:a.y*q*q*q+3*(a.y+(b.y-a.y)*.44)*q*q*t+3*(b.y-(b.y-a.y)*.44)*q*t*t+b.y*t*t*t};}\n  const edge=(a,b)=>`M${a.x} ${a.y}C${a.x} ${a.y+(b.y-a.y)*.44} ${b.x} ${b.y-(b.y-a.y)*.44} ${b.x} ${b.y}`;\n  function positions(route,g){let k=0;return[g.point(0,0),...route.map((side,i)=>g.point(i+1,k+=side))];}\n  function traveler(route,progress,g){const ps=positions(route,g),step=Math.min(route.length,progress*g.n),i=Math.min(route.length,Math.floor(step));return i===route.length?ps[i]:point(ps[i],ps[i+1],step-i);}\n  function trace(route,progress,g){const ps=positions(route,g),steps=Math.min(route.length,progress*g.n);let d=`M${ps[0].x} ${ps[0].y}`;for(let i=0;i\u003cMath.ceil(steps);i++){const end=Math.min(1,steps-i);for(let j=1;j\u003c=24;j++){const p=point(ps[i],ps[i+1],end*j/24);d+=`L${p.x} ${p.y}`;}}return d;}\n  function nearest(a,b,p){const score=t=>{const q=point(a,b,t);return(q.x-p.x)**2+(q.y-p.y)**2;};let best=0,value=Infinity;for(let i=0;i\u003c=32;i++){const t=i/32,v=score(t);if(v\u003cvalue){best=t;value=v;}}let lo=Math.max(0,best-1/32),hi=Math.min(1,best+1/32);for(let i=0;i\u003c20;i++){const l=lo+(hi-lo)/3,r=hi-(hi-lo)/3;if(score(l)\u003cscore(r))hi=r;else lo=l;}let t=(lo+hi)/2;for(const end of [0,1])if(score(end)\u003cscore(t))t=end;return{t,distance:score(t)};}\n  function along(route,p,g){const ps=positions(route,g);let best={progress:0,distance:Infinity};for(let i=0;i\u003croute.length;i++){const q=nearest(ps[i],ps[i+1],p);if(q.distance\u003cbest.distance)best={progress:(i+q.t)/g.n,distance:q.distance};}return best.progress;}\n  return{layout,point,edge,positions,traveler,trace,nearest,along};\n})();\nif(typeof module!=='undefined')module.exports=BranchGeometry;\n\u003c/script>\n\u003cscript>(() => {\n  const M=BranchModel,G=BranchGeometry,K=MotionKit;let s=M.create(),g,held=false;\n  const glyph=K.svg('\u003cpath d=\"M24 7v9C24 26 10 25 10 37M24 16c0 10 14 9 14 21\" fill=\"none\" stroke=\"#648896\" stroke-width=\"1.5\"/>\u003ccircle cx=\"24\" cy=\"7\" r=\"4\" fill=\"#eedbb6\"/>\u003ccircle cx=\"10\" cy=\"39\" r=\"5\" fill=\"none\" stroke=\"#83d6d1\"/>\u003ccircle cx=\"38\" cy=\"39\" r=\"5\" fill=\"none\" stroke=\"#83d6d1\"/>');\n  const ring=K.svg('\u003ccircle cx=\"24\" cy=\"24\" r=\"13\" fill=\"#102230\" fill-opacity=\".55\" stroke=\"#83d6d1\" stroke-width=\"1.2\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"19\" fill=\"none\" stroke=\"#83d6d1\" stroke-opacity=\".15\"/>');\n  const copy=()=>JSON.parse(JSON.stringify(s)),set=p=>M.inspect(s,p),depth=()=>Math.min(M.count(s),Math.floor(s.progress*M.count(s)+1e-7));\n  function describe(){const n=M.count(s),relation=M.relation(s),position=Math.round(s.progress*n*100)/100;return `${n} ${n===1?'fork':'forks'}. Journey at step ${position}. ${relation==='same-arrival'?'Different journeys, the same arrival.':relation==='same-route'?'The same journey was repeated.':relation==='different-arrival'?'These journeys have different arrivals.':s.progress===1?'Journey complete. Return to the start and try another way.':'Drag the warm bead toward either open ring, or select a ring.'}${s.reference?' The dashed trail remembers the previous completed journey.':''}`;}\n  function choose(side){const i=depth();if(i>=M.count(s))return rewind();M.choose(s,i,side);view.tween(s.progress,(i+1)/M.count(s),set,620,()=>view.tone(side));}\n  function rewind(){view.tween(s.progress,0,set,850);}\n  function render(v){\n    const n=M.count(s);g=G.layout(n,v.w,v.h);const at=G.traveler(s.route,s.progress,g),i=depth(),slot=M.arrival(s.route.slice(0,i));let body='',items=[];\n    for(let row=0;row\u003cn;row++)for(let k=0;k\u003c=row;k++)for(const side of [0,1])body+=`\u003cpath d=\"${G.edge(g.point(row,k),g.point(row+1,k+side))}\" fill=\"none\" stroke=\"#648896\" stroke-width=\"1.7\" stroke-opacity=\".22\"/>`;\n    for(let row=1;row\u003c=n;row++)for(let k=0;k\u003c=row;k++){const p=g.point(row,k);body+=`\u003ccircle cx=\"${p.x}\" cy=\"${p.y}\" r=\"${row===n?10:3}\" fill=\"${row===n?'#102230':'#648896'}\" fill-opacity=\".22\" stroke=\"#648896\" stroke-opacity=\".32\"/>`;}\n    if(s.reference){const p=g.point(n,M.arrival(s.reference));body+=`\u003cpath d=\"${G.trace(s.reference,1,g)}\" fill=\"none\" stroke=\"#b7a4e8\" stroke-opacity=\".58\" stroke-width=\"2\" stroke-dasharray=\"3 6\"/>\u003ccircle cx=\"${p.x}\" cy=\"${p.y}\" r=\"18\" fill=\"none\" stroke=\"#b7a4e8\" stroke-opacity=\".65\" stroke-dasharray=\"3 5\"/>`;}\n    const trace=G.trace(s.route,s.progress,g);body+=`\u003cpath d=\"${trace}\" fill=\"none\" stroke=\"#eedbb6\" stroke-opacity=\".06\" stroke-width=\"10\"/>\u003cpath d=\"${trace}\" fill=\"none\" stroke=\"#eedbb6\" stroke-opacity=\".9\" stroke-width=\"2.2\"/>`;\n    if(i\u003cn){for(const side of [0,1]){const p=g.point(i+1,slot+side);body+=`\u003cpath d=\"${G.edge(g.point(i,slot),p)}\" fill=\"none\" stroke=\"#83d6d1\" stroke-opacity=\"${held?.55:.36}\" stroke-width=\"1.8\"/>`;items.push({key:`choice-${side}`,kind:'branch-choice',...p,art:ring,label:`Take the ${side?'right':'left'} branch at fork ${i+1}.`});}}\n    const home=g.point(0,0);if(Math.hypot(at.x-home.x,at.y-home.y)>60)items.push({key:'home',kind:'branch-home',...home,art:K.svg('\u003ccircle cx=\"24\" cy=\"24\" r=\"12\" fill=\"none\" stroke=\"#eedbb6\" stroke-opacity=\".45\"/>\u003cpath d=\"m18 23 6-6 6 6M24 17v14\" fill=\"none\" stroke=\"#eedbb6\" stroke-opacity=\".6\"/>'),label:'Return the bead to its starting place. The recorded journey remains scrubbable.'});\n    const end=s.progress===1,same=M.relation(s)==='same-arrival';\n    if(same)body+=`\u003ccircle cx=\"${at.x}\" cy=\"${at.y}\" r=\"33\" fill=\"#83d6d1\" fill-opacity=\".035\" stroke=\"#83d6d1\" stroke-opacity=\".5\"/>`;\n    const art=K.svg(`\u003ccircle cx=\"24\" cy=\"24\" r=\"21\" fill=\"#eedbb6\" fill-opacity=\"${held?.10:.035}\" stroke=\"#eedbb6\" stroke-opacity=\"${held?.6:.25}\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"11\" fill=\"#eedbb6\"/>${end?'\u003cpath d=\"M8 11a21 21 0 0 1 32 4M40 8v8h-8\" fill=\"none\" stroke=\"#83d6d1\" stroke-width=\"1.2\"/>':''}`);\n    items.push({key:'traveler',kind:'branch-traveler',...at,art,label:end?'Journey complete. Tap to return to the start, or drag back along the trail.':'Warm bead. Drag toward an open ring. Tap to demonstrate one step. Left and right arrow keys choose a branch; up moves back.'});\n    v.paint(body,items);v.examples(s.seed%3,3);document.getElementById('timeline').disabled=s.route.length===0;\n  }\n  const view=K.create({title:'Branch',description:'One warm bead meets one fork. Drag it toward an open ring or tap a ring to choose a direction. Tapping the bead demonstrates one step. Return to the starting ring and choose a different journey; a dashed trace remembers the last completed one. Later examples repeat the same fork. Some different journeys meet at the same arrival. Play and the timeline replay the chosen journey without generating a new one. This is deliberate choice, not a random or physical simulation.',glyph,render,describe,progress:()=>s.progress,snapshot:copy,restore:v=>{s=M.restore(v);held=false;},scrub:set,\n    play(){if(s.progress===1)s.progress=0;M.plan(s);view.tween(s.progress,1,set,Math.max(500,(1-s.progress)*M.count(s)*1050),()=>view.tone(2));},rewind,example(){s=M.create(s.seed+1);held=false;},\n    activate(key){held=false;if(key.startsWith('choice-'))choose(Number(key.at(-1)));else if(key==='home')rewind();else if(key==='traveler'){const i=depth();if(i===M.count(s))rewind();else choose(s.route[i]??i%2);}},\n    nudge(key,dir,keyName){if(key!=='traveler')return;if(keyName==='ArrowUp')view.tween(s.progress,Math.max(0,Math.ceil(s.progress*M.count(s)-1e-7)-1)/M.count(s),set,450);else if(keyName==='ArrowDown'){const i=depth();if(i\u003cM.count(s))choose(s.route[i]??i%2);}else choose(dir>0?1:0);},\n    down(key){if(key!=='traveler')return null;held=true;return{original:copy(),depth:depth(),mode:s.progress===1?'trace':'choose',t:0};},\n    move(d,p){\n      if(d.mode==='trace'||d.depth>0&&p.y\u003cg.point(d.depth,0).y-14){d.mode='trace';set(G.along(d.original.route,p,g));return;}\n      const k=M.arrival(d.original.route.slice(0,d.depth)),a=g.point(d.depth,k),options=[0,1].map(side=>({side,...G.nearest(a,g.point(d.depth+1,k+side),p)})),best=options.reduce((x,y)=>x.distance\u003cy.distance?x:y);\n      // Evaluate every preview from the same snapshot, including the remembered trail.\n      s=M.restore(d.original);M.choose(s,d.depth,best.side);d.t=best.t;set((d.depth+best.t)/M.count(s));\n    },\n    up(d){held=false;if(d.mode==='trace')view.tween(s.progress,Math.round(s.progress*M.count(s))/M.count(s),set,400);else if(d.t>=.5)view.tween(s.progress,(d.depth+1)/M.count(s),set,350,()=>view.tone(1));else s=M.restore(d.original);},\n    cancel(d){held=false;s=M.restore(d.original);},escape(){held=false;}\n  });view.start();\n})();\n\u003c/script>\n\u003c/body>\u003c/html>\n","composition":"\u003c!doctype html>\n\u003chtml lang=\"en\" data-lesson=\"composition\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#0a1420\">\n\u003cmeta name=\"description\" content=\"A wordless collection of interactive mathematical mechanisms. Pair, sort, and compose. Works offline.\">\n\u003ctitle>Composition \u00b7 Mathematics in Motion\u003c/title>\n\u003cstyle>:root{color-scheme:dark;--bg:#0a1420;--panel:#102230;--ink:#eedbb6;--soft:#afc3ca;--line:#486574;--aqua:#83d6d1;--violet:#b7a4e8;--gold:#ead19b;--focus:#f5e5bb;--boundary:#7d9fae;--texture:rgba(145,186,200,.025)}\n*{box-sizing:border-box}html,body{margin:0;min-width:280px;min-height:100%;background:var(--bg)}body{font-family:system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:radial-gradient(ellipse at 50% 40%,#142938 0%,#0a1420 64%)}\nbutton,input{font:inherit}button{cursor:pointer;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:5px}button:disabled{cursor:default}svg{display:block;overflow:visible}button svg{width:100%;height:100%;pointer-events:none}button{border:0;background:none;padding:0}button:active{filter:brightness(1.2)}\n.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}\n#motion-app{width:min(100%,1020px);height:100vh;height:100svh;min-height:540px;max-height:1040px;margin:auto;display:grid;grid-template-rows:82px minmax(320px,1fr) 134px;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);position:relative}\n.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:5}.signature{width:40px;height:40px;opacity:.64}.signature svg{width:100%;height:100%;fill:none;stroke:var(--ink);stroke-width:1.1}.signature svg circle:last-of-type{fill:var(--ink);stroke:none}\n#lesson-nav{display:flex;gap:18px;align-items:center}.nav-button{width:66px;height:54px;position:relative;opacity:.45;transition:opacity .25s,background .25s;border-radius:20px;padding:9px}.nav-button[aria-pressed=true]{opacity:1;background:rgba(143,190,199,.065)}.nav-button[aria-pressed=true]:after{content:\"\";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);left:calc(50% - 2px);bottom:-6px}.nav-button:hover{opacity:1}\n.icon-button{width:44px;height:44px;flex:none;padding:12px;opacity:.64;border-radius:50%;transition:opacity .2s,background .2s}.icon-button:hover{opacity:1;background:rgba(145,186,200,.06)}.audio-button[aria-pressed=true]{opacity:1;color:var(--gold)}\n#stage{position:relative;min-height:320px;border-radius:36px;background:radial-gradient(ellipse at 50% 42%,rgba(96,145,157,.045),transparent 72%);isolation:isolate}#scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#objects{position:absolute;inset:0;pointer-events:none}\n.object{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;display:grid;place-items:center;border-radius:50%;width:48px;height:48px;z-index:3;will-change:left,top}.object.token{cursor:grab}.object.token:active{cursor:grabbing}.object.selected{background:rgba(238,219,182,.055)}.object.selected:after{content:\"\";position:absolute;inset:0;border:1px solid rgba(238,219,182,.46);border-radius:50%}.object:hover{background:rgba(145,186,200,.045)}.object .token-art{width:42px;height:42px;filter:drop-shadow(0 0 8px rgba(234,209,155,.11));transition:filter .15s}.object:hover .token-art,.object.selected .token-art{filter:drop-shadow(0 0 10px rgba(234,209,155,.36))}.object.target{z-index:2;width:52px;height:52px}.object.target.ready{background:rgba(131,214,209,.05)}.object.target.ready:after{content:\"\";position:absolute;inset:6px;border:1px dashed rgba(131,214,209,.48);border-radius:50%}.object.region{width:58px;height:58px;z-index:1}.object.gate{border-radius:19px;z-index:2;cursor:grab}.object.gate:hover{background:rgba(145,186,200,.03)}.object.gate:active{cursor:grabbing}.object.reserve{border-radius:16px;width:76px;height:48px;z-index:1}.object.dragging{z-index:8;filter:drop-shadow(0 0 15px rgba(234,209,155,.26))}\n.app-footer{z-index:5;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 max(5%,8px)}.transport{display:flex;align-items:center;gap:20px}.play-button{flex:none;width:48px;height:48px;border:1px solid rgba(197,217,216,.23);border-radius:50%;padding:15px;color:var(--ink);background:rgba(143,190,199,.035);transition:background .2s,border-color .2s}.play-button:hover{background:rgba(143,190,199,.09);border-color:rgba(197,217,216,.45)}\ninput[type=range]{--progress:0%;width:100%;min-width:0;height:44px;appearance:none;-webkit-appearance:none;background:transparent;cursor:ew-resize;touch-action:pan-y;margin:0}input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:8px;background:linear-gradient(to right,rgba(234,209,155,.7) 0%,rgba(234,209,155,.7) var(--progress),rgba(125,159,174,.22) var(--progress),rgba(125,159,174,.22) 100%)}input[type=range]::-moz-range-track{height:3px;border-radius:8px;background:rgba(125,159,174,.22)}input[type=range]::-moz-range-progress{height:3px;background:rgba(234,209,155,.7)}input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;border:4px solid #152736;background:var(--ink);box-shadow:0 0 0 1px rgba(238,219,182,.42);margin-top:-7.5px}input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;border:4px solid #152736;background:var(--ink);box-shadow:0 0 0 1px rgba(238,219,182,.42)}\n.tools{display:flex;align-items:center;justify-content:center;gap:28px}.tool-button{width:52px;height:44px;padding:9px 12px;opacity:.67;border-radius:15px;transition:background .2s,opacity .2s}.tool-button:hover{opacity:1;background:rgba(143,190,199,.06)}.lesson-seal{width:30px;height:30px;opacity:.24;transition:opacity .35s}.lesson-seal.complete{opacity:.95}.lesson-seal svg{width:100%;height:100%}\n.scene-enter{animation:scene-arrive .38s ease both}@keyframes scene-arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}\n@media(max-width:560px){#motion-app{padding-left:10px;padding-right:10px;grid-template-rows:72px minmax(320px,1fr) 130px}.app-header{padding:0 8px}.signature{width:28px;height:28px}#lesson-nav{gap:8px}.nav-button{width:58px;height:48px;padding:8px}.app-footer{padding-left:18px;padding-right:18px}.transport{gap:14px}#stage{border-radius:24px}}\n@media(max-height:600px){#motion-app{min-height:550px;grid-template-rows:64px minmax(350px,1fr) 130px}.app-header{padding-top:2px}}\n@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.object .token-art{filter:none}}\n.embedded #motion-app{grid-template-rows:42px minmax(320px,1fr) 130px;min-height:540px}.embedded .signature{visibility:hidden}.embedded #lesson-nav{opacity:.4}.embedded .nav-button{width:40px;height:36px;padding:6px}.embedded .nav-button:after{display:none}.embedded .app-header{padding-top:0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain id=\"motion-app\" data-edition=\"composition\">\n  \u003ch1 class=\"sr-only\" id=\"lesson-title\">Mathematics in Motion\u003c/h1>\n  \u003cheader class=\"app-header\">\n    \u003cdiv class=\"signature\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 40 40\">\u003ccircle cx=\"20\" cy=\"20\" r=\"12\"/>\u003ccircle cx=\"20\" cy=\"20\" r=\"3\"/>\u003cpath d=\"M20 3v5M20 32v5M3 20h5M32 20h5\"/>\u003c/svg>\u003c/div>\n    \u003cnav id=\"lesson-nav\" aria-label=\"Choose a mathematical experience\">\u003c/nav>\n    \u003cbutton class=\"icon-button audio-button\" id=\"sound\" type=\"button\" aria-label=\"Enable optional sound\" aria-pressed=\"false\">\u003c/button>\n  \u003c/header>\n  \u003csection id=\"stage\" aria-labelledby=\"lesson-title\" aria-describedby=\"lesson-description\">\n    \u003csvg id=\"scene\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\n    \u003cdiv id=\"objects\">\u003c/div>\n  \u003c/section>\n  \u003cfooter class=\"app-footer\">\n    \u003cdiv class=\"transport\">\n      \u003cbutton class=\"play-button\" id=\"play\" type=\"button\" aria-label=\"Play the transformation\">\u003c/button>\n      \u003clabel class=\"sr-only\" for=\"timeline\">Inspect the transformation\u003c/label>\n      \u003cinput id=\"timeline\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"0\" aria-describedby=\"timeline-description\">\n      \u003cbutton class=\"icon-button\" id=\"rewind\" type=\"button\" aria-label=\"Return to the start of this transformation\">\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"tools\">\n      \u003cbutton class=\"tool-button\" id=\"arrange\" type=\"button\" aria-label=\"Rearrange the same objects\">\u003c/button>\n      \u003cdiv class=\"lesson-seal\" id=\"lesson-seal\" aria-hidden=\"true\">\u003c/div>\n      \u003cbutton class=\"tool-button\" id=\"example\" type=\"button\" aria-label=\"Explore another example\">\u003c/button>\n    \u003c/div>\n  \u003c/footer>\n  \u003cp id=\"lesson-description\" class=\"sr-only\">\u003c/p>\n  \u003cp id=\"timeline-description\" class=\"sr-only\">\u003c/p>\n  \u003cp id=\"status\" class=\"sr-only\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\n\u003c/main>\n\u003cscript>/* Exact finite models and deterministic geometry. No browser dependencies. */\nconst MotionMath = (() => {\n  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));\n  const mix = (a, b, t) => t === 0 ? a : t === 1 ? b : a + (b - a) * t;\n  const smooth = x => { const t = clamp(x); return t * t * (3 - 2 * t); };\n  const point = (a, b, t) => ({ x: mix(a.x, b.x, t), y: mix(a.y, b.y, t) });\n  function random(seed) {\n    let value = (seed + 1) >>> 0;\n    return () => { value = (Math.imul(1664525, value) + 1013904223) >>> 0; return value / 4294967296; };\n  }\n  function shuffled(values, seed) {\n    const out = values.slice(), rng = random(seed);\n    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }\n    return out;\n  }\n  const row = (i, n, left = .2, right = .8) => n === 1 ? .5 : mix(left, right, i / (n - 1));\n  const CASES = [[2, 2], [3, 3], [3, 4], [4, 3], [4, 4]];\n  function pairing(seed = 0) {\n    const [a, b] = CASES[seed % CASES.length];\n    const tokens = Array.from({ length: Math.max(a, b) }, (_, i) => ({\n      id: i, shape: seed > 3 && i % 2 ? 'diamond' : 'circle', active: i \u003c a,\n      x: i \u003c a ? row(i, a, a >= 4 ? .19 : .25, a >= 4 ? .81 : .75) : .5,\n      y: i \u003c a ? .25 + (i % 2) * .025 : .43\n    }));\n    const sockets = Array.from({ length: b }, (_, i) => ({ id: i, x: row(i, b, .22, .78), y: .67 }));\n    return { kind: 'pairing', seed, tokens, sockets, links: seed === 0 ? { 0: 0 } : {}, progress: seed === 0 ? 1 : 0, selected: null, layout: 0 };\n  }\n  function reservePoint(state, token) {\n    const pool = state.tokens.filter(t => !t.active);\n    return { x: row(pool.findIndex(t => t.id === token.id), pool.length, .32, .68), y: .88 };\n  }\n  function pairPoint(state, token) {\n    if (!token.active) return reservePoint(state, token);\n    const id = state.links[token.id];\n    const target = state.sockets.find(s => s.id === id);\n    return target ? point(token, target, smooth(state.progress)) : { x: token.x, y: token.y };\n  }\n  function connect(state, tokenId, socketId) {\n    const token = state.tokens.find(t => t.id === tokenId);\n    if (!token || !state.sockets.some(s => s.id === socketId)) return false;\n    if (Object.entries(state.links).some(([id, socket]) => Number(id) !== tokenId && socket === socketId)) return false;\n    token.active = true;\n    state.links[tokenId] = socketId;\n    state.selected = null;\n    return true;\n  }\n  function putAway(state, tokenId) {\n    const token = state.tokens.find(t => t.id === tokenId);\n    if (!token) return;\n    token.active = false;\n    delete state.links[tokenId];\n    state.selected = null;\n  }\n  fun ton>\u003clabel for=\"timeline\" class=\"sr-only\">Inspect the transformation\u003c/label>\u003cinput id=\"timeline\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"0\">\u003cbutton id=\"rewind\" class=\"quiet-control\" type=\"button\" aria-label=\"Return to the beginning\">\u003c/button>\u003c/div>\n    \u003cdiv class=\"tools\">\u003cdiv id=\"example-progress\" class=\"example-progress\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"example\" class=\"quiet-control\" type=\"button\" aria-label=\"Explore another example\">\u003c/button>\u003c/div>\n  \u003c/footer>\n  \u003cp id=\"lesson-description\" class=\"sr-only\">\u003c/p>\u003cp id=\"status\" class=\"sr-only\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\n\u003c/main>\n\n\u003cscript>/* Portable document contract v1. Parent identity is checked; no network access. */\nconst MotionBridge = (() => {\n  const channel = 'mathematics-in-motion/v1';\n  let hooks = null;\n  const lesson = document.documentElement.dataset.lesson;\n  const embedded = window.parent !== window;\n  if (embedded) document.documentElement.classList.add('embedded');\n  function send(type, extra = {}) {\n    if (embedded) window.parent.postMessage({channel, lesson, type, ...extra}, '*');\n  }\n  function changed() { if (hooks) send('state', {state: hooks.snapshot()}); }\n  window.addEventListener('message', event => {\n    if (!embedded || event.source !== window.parent || event.data?.channel !== channel || !hooks) return;\n    const data = event.data;\n    if (data.type === 'restore') {\n      if (data.state) hooks.restore(data.state);\n      changed();\n    } else if (data.type === 'pause') {\n      hooks.pause();\n      send('paused', {request: data.request, state: hooks.snapshot()});\n    }\n  });\n  return {\n    connect(value) { hooks = value; send('ready'); },\n    changed,\n    explored() { send('explored'); }\n  };\n})();\n\u003c/script>\n\u003cscript>/* Small optional author kit. Lessons own models, state, geometry, and gestures. */\nconst MotionKit = (() => {\n  const C = ['#eedbb6','#83d6d1','#b7a4e8','#d8a78b'];\n  const shapes = ['circle','square','triangle','diamond'];\n  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));\n  const smooth = x => x*x*(3-2*x);\n  const f = x => Number(x).toFixed(3);\n  const svg = body => `\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">${body}\u003c/svg>`;\n  function shape(kind,x,y,r,color=C[0],filled=true,opacity=1) {\n    const a=`fill=\"${filled?color:'none'}\" stroke=\"${color}\" stroke-width=\"${filled?.7:1.2}\" opacity=\"${opacity}\" stroke-linejoin=\"round\"`;\n    if(kind==='circle')return `\u003ccircle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"${r}\" ${a}/>`;\n    if(kind==='square')return `\u003crect x=\"${f(x-r)}\" y=\"${f(y-r)}\" width=\"${2*r}\" height=\"${2*r}\" rx=\"2.5\" ${a}/>`;\n    if(kind==='triangle')return `\u003cpath d=\"M${f(x)} ${f(y-r*1.15)}L${f(x+r)} ${f(y+r*.8)}L${f(x-r)} ${f(y+r*.8)}Z\" ${a}/>`;\n    return `\u003cpath d=\"M${f(x)} ${f(y-r*1.2)}L${f(x+r)} ${f(y)}L${f(x)} ${f(y+r*1.2)}L${f(x-r)} ${f(y)}Z\" ${a}/>`;\n  }\n  const icons={\n    play:svg('\u003cpath d=\"m18 10 20 14-20 14Z\" fill=\"currentColor\"/>'),\n    pause:svg('\u003cpath d=\"M18 12v24M30 12v24\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>'),\n    rewind:svg('\u003cpath d=\"M12 12a16 16 0 1 1-3 20M12 3v11H2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'),\n    example:svg('\u003crect x=\"5\" y=\"5\" width=\"27\" height=\"27\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" opacity=\".45\"/>\u003crect x=\"16\" y=\"16\" width=\"27\" height=\"27\" rx=\"8\" fill=\"#102230\" stroke=\"currentColor\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"2\" fill=\"currentColor\"/>\u003ccircle cx=\"35\" cy=\"35\" r=\"2\" fill=\"currentColor\"/>'),\n    silent:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM33 18l10 12M43 18 33 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>'),\n    sound:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM32 17q7 7 0 14M38 10q13 14 0 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>')\n  };\n  function create(spec) {\n    const $=id=>document.getElementById(id);\n    const stage=$('stage'),scene=$('scene'),objects=$('objects'),range=$('timeline'),play=$('play');\n    let w=640,h=500,frame=0,animation=null,drag=null,suppress=null,lastStatus='';\n    let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let audio=null,enabled=false;\n    const buttons=new Map();\n    $('lesson-title').textContent=spec.title;\n    $('lesson-description').textContent=spec.description;\n    $('lesson-glyph').innerHTML=spec.glyph;\n    $('rewind').innerHTML=icons.rewind;$('example').innerHTML=icons.example;$('sound').innerHTML=icons.silent;\n    function announce(text) {if(text!==lastStatus){$('status').textContent=text;lastStatus=text;}}\n    function stop(){animation=null;cancelAnimationFrame(frame);frame=0;play.innerHTML=icons.play;play.setAttribute('aria-label','Play the transformation');}\n    function paint(body,items=[]) {\n      scene.innerHTML=body;\n      const seen=new Set();\n      for(const item of items){\n        seen.add(item.key);let b=buttons.get(item.key);\n        if(!b){b=document.createElement('button');b.type='button';b.dataset.key=item.key;objects.appendChild(b);buttons.set(item.key,b);}\n        b.className=`piece ${item.kind||'token'}${drag?.key===item.key?' dragging':''}`;\n        b.style.left=`${item.x}px`;b.style.top=`${item.y}px`;\n        b.setAttribute('aria-label',item.label);\n        if(item.selected!==undefined)b.setAttribute('aria-pressed',String(item.selected));\n        const art=item.art??svg(shape(item.shape||'circle',24,24,11,item.color||C[0]));\n        if(b.dataset.art!==art){b.innerHTML=art;b.dataset.art=art;}\n      }\n      for(const [key,b] of buttons)if(!seen.has(key)){b.remove();buttons.delete(key);}\n    }\n    function render(){spec.render(api);range.value=String(clamp(spec.progress())*1000);range.setAttribute('aria-valuetext',spec.describe());}\n    function changed(){announce(spec.describe());MotionBridge.changed();}\n    function tone(index=0){\n      if(!enabled||!audio)return;\n      const time=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();\n      osc.frequency.value=[261.63,329.63,392,523.25][Math.abs(index)%4];\n      gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.045,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+.38);\n      osc.connect(gain);gain.connect(audio.destination);osc.start(time);osc.stop(time+.4);osc.onended=()=>{osc.disconnect();gain.disconnect();};\n    }\n    function tween(from,to,setter,duration=600,after=null){\n      stop();\n      if(reduced||Math.abs(to-from)\u003c1e-8){setter(to);render();after?.();changed();return;}\n      animation={from,to,setter,start:performance.now(),duration,after};\n      play.innerHTML=icons.pause;play.setAttribute('aria-label','Pause the transformation');\n      const tick=now=>{\n        if(!animation)return;const a=animation,t=clamp((now-a.start)/a.duration);\n        a.setter(t===1?a.to:a.from+(a.to-a.from)*smooth(t));render();\n        if(t===1){stop();a.after?.();changed();}else frame=requestAnimationFrame(tick);\n      };frame=requestAnimationFrame(tick);\n    }\n    function cancelDrag(){if(!drag)return;const old=drag;drag=null;spec.cancel?.(old);try{old.button.releasePointerCapture(old.pointer);}catch{}render();}\n    function point(event){const r=stage.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top};}\n    objects.addEventListener('pointerdown',event=>{\n      const button=event.target.closest('button[data-key]');if(!button||drag||event.button!==0)return;\n      stop();suppress=null;const p=point(event),key=button.dataset.key;\n      const detail=spec.down?.(key,p);if(!detail)return;\n      drag={...detail,key,button,pointer:event.pointerId,start:p,moved:false};\n      button.setPointerCapture(event.pointerId);render();\n    });\n    objects.addEventListener('pointermove',event=>{\n      if(!drag||drag.pointer!==event.pointerId)return;const p=point(event);\n      if(!drag.moved&&Math.hypot(p.x-drag.start.x,p.y-drag.start.y)\u003c3)return;\n      drag.moved=true;spec.move?.(drag,p);render();\n    });\n    objects.addEventListener('pointerup',event=>{\n      if(!drag||drag.pointer!==event.pointerId)return;const ended=drag;drag=null;\n      try{ended.button.releasePointerCapture(ended.pointer);}catch{}\n      if(ended.moved){suppress=ended.key;spec.up?.(ended,point(event));render();changed();MotionBridge.explored();}\n    });\n    for(const name of ['pointercancel','lostpointercapture'])objects.addEventListener(name,event=>{if(drag?.pointer===event.pointerId){cancelDrag();changed();}});\n    objects.addEventListener('click',event=>{\n      const button=event.target.closest('button[data-key]');if(!button)return;\n      if(event.detail>0&&suppress===button.dataset.key){suppress=null;return;}\n      suppress=null;stop();spec.activate?.(button.dataset.key);render();changed();MotionBridge.explored();\n    });\n    objects.addEventListener('keydown',event=>{\n      const button=event.target.closest('button[data-key]');if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      if(spec.nudge){event.preventDefault();cancelDrag();stop();spec.nudge(button.dataset.key,['ArrowRight','ArrowUp'].includes(event.key)?1:-1,event.key);render();changed();}\n    });\n    play.addEventListener('click',()=>{cancelDrag();if(animation){stop();changed();return;}spec.play();render();MotionBridge.explored();});\n    $('rewind').addEventListener('click',()=>{cancelDrag();stop();spec.rewind();render();changed();});\n    $('example').addEventListener('click',()=>{cancelDrag();stop();spec.example();render();changed();tone(2);});\n    range.addEventListener('input',()=>{const p=Number(range.value)/1000;cancelDrag();stop();spec.scrub(p);render();});\n    range.addEventListener('change',()=>{spec.settle?.();render();changed();MotionBridge.explored();});\n    range.addEventListener('keydown',event=>{\n      if(!spec.step||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      event.preventDefault();cancelDrag();stop();spec.step(['ArrowRight','ArrowUp'].includes(event.key)?1:-1);render();changed();\n    });\n    $('sound').addEventListener('click',async()=>{\n      if(enabled){enabled=false;audio?.suspend();}else{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){announce('Optional sound is unavailable.');return;}try{audio||=new Audio();await audio.resume();enabled=true;tone(0);}catch{announce('Optional sound could not start.');return;}}\n      $('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Mute optional sound':'Enable optional sound');$('sound').innerHTML=icons[enabled?'sound':'silent'];\n    });\n    function pause(){cancelDrag();stop();if(enabled){enabled=false;audio?.suspend();$('sound').innerHTML=icons.silent;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable optional sound');}}\n    function resize(){cancelDrag();const r=stage.getBoundingClientRect();w=Math.max(260,r.width);h=Math.max(370,r.height);scene.setAttribute('viewBox',`0 0 ${w} ${h}`);render();}\n    const api={get w(){return w;},get h(){return h;},get reduced(){return reduced;},paint,render,tween,stop,changed,tone,announce,\n      examples(index,count){$('example-progress').innerHTML=Array.from({length:count},(_,i)=>`\u003cspan class=\"example-dot${i===index?' active':''}\">\u003c/span>`).join('');},\n      start(){stop();new ResizeObserver(resize).observe(stage);resize();MotionBridge.connect({snapshot:spec.snapshot,restore(value){pause();spec.restore(value);render();},pause});}\n    };\n    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();changed();}});\n    window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();stop();spec.escape?.();render();changed();}});\n    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduced=event.matches;if(reduced){pause();spec.settle?.();render();changed();}});\n    return api;\n  }\n  return {C,shapes,clamp,smooth,f,svg,shape,create};\n})();\n\u003c/script>\n\u003cscript>const UndoModel = (() => {\n  const permutations=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];\n  const targets=[[1,2,0],[1,0,2],[2,0,1],[2,1,0]];\n  const compose=(a,b)=>a.map(x=>b[x]);\n  const inverse=p=>p.map((_,i)=>p.indexOf(i));\n  const equal=(a,b)=>a.every((x,i)=>x===b[i]);\n  const create=(seed=0)=>({version:1,seed,choice:0,progress:0});\n  const target=s=>targets[s.seed%targets.length];\n  function choices(s){const correct=inverse(target(s)),wrong=permutations.filter(p=>!equal(p,correct));const out=[wrong[s.seed%wrong.length],wrong[(s.seed+2)%wrong.length]];out.splice(1+s.seed%2,0,correct);return out;}\n  const result=s=>compose(target(s),choices(s)[s.choice]);\n  const solved=s=>equal(result(s),permutations[0]);\n  function restore(v){return v?.version===1&&Number.isInteger(v.seed)&&v.seed>=0&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice\u003c3&&Number.isFinite(v.progress)&&v.progress>=0&&v.progress\u003c=1?{version:1,seed:v.seed,choice:v.choice,progress:v.progress}:create();}\n  return{permutations,targets,compose,inverse,equal,create,target,choices,result,solved,restore};\n})();\nif(typeof module!=='undefined')module.exports=UndoModel;\n\u003c/script>\n\u003cscript>/* Shared drawing primitive: recorded column-vector permutations, first then second. */\nconst MotionRoutes = (() => {\n  const {f,shape,C,svg}=MotionKit;\n  const xs=[.22,.5,.78];\n  function lanes(chain,input){const out=[input];for(const p of chain)out.push(p[out.at(-1)]);return out;}\n  function path(chain,input,box){\n    const track=lanes(chain,input),{x,y,w,h}=box,n=chain.length;\n    let d=`M${f(x+xs[input]*w)} ${f(y)}`;\n    for(let i=0;i\u003cn;i++){\n      const y0=y+h*(i+.18)/n,y1=y+h*(i+.82)/n;\n      const a=x+xs[track[i]]*w,b=x+xs[track[i+1]]*w;\n      d+=`L${f(a)} ${f(y0)}C${f(a)} ${f(y0+(y1-y0)/3)} ${f(b)} ${f(y1-(y1-y0)/3)} ${f(b)} ${f(y1)}`;\n    }\n    return d+`L${f(x+xs[track.at(-1)]*w)} ${f(y+h)}`;\n  }\n  function point(chain,input,t,box){\n    const track=lanes(chain,input),n=chain.length,p=MotionKit.clamp(t)*n,i=Math.min(n-1,Math.floor(p)),local=p-i;\n    const q=MotionKit.smooth(MotionKit.clamp((local-.18)/.64));\n    return{x:box.x+(xs[track[i]]+(xs[track[i+1]]-xs[track[i]])*q)*box.w,y:box.y+MotionKit.clamp(t)*box.h};\n  }\n  function card(perm){return svg(perm.map((_,i)=>`\u003cpath d=\"${path([perm],i,{x:0,y:5,w:48,h:38})}\" fill=\"none\" stroke=\"${C[i]}\" stroke-width=\"1.2\"/>`).join(''));}\n  function drawing(chain,t,box,{ghosts=null,complete=false,radius=10}={}){\n    let body='';\n    chain.forEach((_,i)=>{const y=box.y+box.h*(i+.18)/chain.length,h=box.h*.64/chain.length;body+=`\u003crect x=\"${f(box.x+box.w*.07)}\" y=\"${f(y-5)}\" width=\"${f(box.w*.86)}\" height=\"${f(h+10)}\" rx=\"15\" fill=\"${C[i%2+1]}\" fill-opacity=\".025\" stroke=\"${C[i%2+1]}\" stroke-opacity=\".32\"/>`;});\n    for(let i=0;i\u003c3;i++){\n      body+=`\u003cpath d=\"${path(chain,i,box)}\" fill=\"none\" stroke=\"${C[i]}\" stroke-width=\"1.3\" stroke-opacity=\".4\"/>`;\n      body+=`\u003ccircle cx=\"${f(box.x+xs[i]*box.w)}\" cy=\"${f(box.y+box.h)}\" r=\"${radius+7}\" fill=\"none\" stroke=\"${complete?C[1]:'#648896'}\" stroke-opacity=\".6\"/>`;\n      if(ghosts)body+=shape(MotionKit.shapes[ghosts[i]],box.x+xs[i]*box.w,box.y+box.h,radius+3,C[ghosts[i]],false,.4);\n    }\n    return body;\n  }\n  return{xs,lanes,path,point,card,drawing};\n})();\n\u003c/script>\n\u003cscript>(() => {\n  const M=UndoModel,K=MotionKit,R=MotionRoutes;let s=M.create(),dragTile=null;\n  const set=p=>{s.progress=p;};\n  function choose(index){if(index===s.choice)return;view.tween(s.progress,0,set,340,()=>{s.choice=index;view.render();view.tone(index);});}\n  function describe(){return s.progress\u003c1?'Choose a lower routing tile, then follow all three shapes through the two mechanisms.':M.solved(s)?'All three shapes have returned to their original tracks. The second mechanism undoes the first.':'The shapes have not all returned to their original tracks. Try another lower tile.';}\n  const view=K.create({title:'Undo',description:'The upper routing mechanism rearranges three shapes. Choose or drag a small routing tile into the lower mechanism, then play or scrub. Faint outlines at the outputs mark the original arrangement. A true undo restores every input. The lower tiles are three different operations.',glyph:R.card([2,0,1]),progress:()=>s.progress,describe,snapshot:()=>({...s}),restore:v=>{s=M.restore(v);},\n    render(v){\n      const box={x:0,y:v.h*.10,w:v.w,h:v.h*.62},chain=[M.target(s),M.choices(s)[s.choice]];\n      let body=R.drawing(chain,s.progress,box,{ghosts:[0,1,2],complete:s.progress===1&&M.solved(s)}),items=[];\n      for(let i=0;i\u003c3;i++){const p=R.point(chain,i,s.progress,box);body+=K.shape(K.shapes[i],p.x,p.y,11,K.C[i]);}\n      const gap=Math.min(94,v.w*.28);\n      M.choices(s).forEach((p,i)=>items.push({key:`choice-${i}`,kind:'choice',x:dragTile?.choice===i?dragTile.x:v.w/2+(i-1)*gap,y:dragTile?.choice===i?dragTile.y:v.h*.89,art:R.card(p),selected:s.choice===i,label:`Candidate ${i+1}. Routes input tracks to ${p.map(x=>x+1).join(', ')}. Select it or drag it into the lower mechanism.`}));\n      v.paint(body,items);v.examples(s.seed%M.targets.length,M.targets.length);\n    },\n    play(){if(s.progress===1)view.tween(1,0,set,500,()=>view.tween(0,1,set,2600));else view.tween(s.progress,1,set,2600*(1-s.progress),()=>{if(M.solved(s))view.tone(3);});},\n    rewind(){view.tween(s.progress,0,set,550);},scrub:set,example(){s=M.create(s.seed+1);},activate(key){if(key.startsWith('choice-'))choose(Number(key.split('-')[1]));},\n    down(key){return key.startsWith('choice-')?{choice:Number(key.split('-')[1])}:null;},\n    move(d,p){dragTile={choice:d.choice,x:K.clamp(p.x,32,view.w-32),y:K.clamp(p.y,28,view.h-28)};view.announce('Release the routing tile inside the lower mechanism.');},\n    up(d,p){dragTile=null;if(p.x>view.w*.07&&p.x\u003cview.w*.93&&p.y>view.h*.4&&p.y\u003cview.h*.72)choose(d.choice);},\n    cancel(){dragTile=null;},nudge(key,dir){if(key.startsWith('choice-'))choose((s.choice+dir+3)%3);}\n  });view.start();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","same":"\u003c!doctype html>\n\u003chtml lang=\"en\" data-lesson=\"same\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#0a1420\">\u003ctitle>Same \u00b7 Mathematics in Motion\u003c/title>\u003cstyle>:root{color-scheme:dark;--bg:#0a1420;--ink:#eedbb6;--aqua:#83d6d1;--violet:#b7a4e8;--line:#648896;--soft:#aec4cb}\n*{box-sizing:border-box}html,body{margin:0;min-width:280px;min-height:100%;background:var(--bg)}body{color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 35%,#152c3b, #0a1420 70%);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}button:focus-visible,input:focus-visible{outline:2px solid #f5e5bb;outline-offset:4px}button svg{width:100%;height:100%;pointer-events:none}svg{display:block}button:active{filter:brightness(1.2)}[hidden]{display:none!important}\n.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-sp aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"example\" class=\"quiet-control\" type=\"button\" aria-label=\"Explore another example\">\u003c/button>\u003c/div>\n  \u003c/footer>\n  \u003cp id=\"lesson-description\" class=\"sr-only\">\u003c/p>\u003cp id=\"status\" class=\"sr-only\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\n\u003c/main>\n\n\u003cscript>/* Portable document contract v1. Parent identity is checked; no network access. */\nconst MotionBridge = (() => {\n  const channel = 'mathematics-in-motion/v1';\n  let hooks = null;\n  const lesson = document.documentElement.dataset.lesson;\n  const embedded = window.parent !== window;\n  if (embedded) document.documentElement.classList.add('embedded');\n  function send(type, extra = {}) {\n    if (embedded) window.parent.postMessage({channel, lesson, type, ...extra}, '*');\n  }\n  function changed() { if (hooks) send('state', {state: hooks.snapshot()}); }\n  window.addEventListener('message', event => {\n    if (!embedded || event.source !== window.parent || event.data?.channel !== channel || !hooks) return;\n    const data = event.data;\n    if (data.type === 'restore') {\n      if (data.state) hooks.restore(data.state);\n      changed();\n    } else if (data.type === 'pause') {\n      hooks.pause();\n      send('paused', {request: data.request, state: hooks.snapshot()});\n    }\n  });\n  return {\n    connect(value) { hooks = value; send('ready'); },\n    changed,\n    explored() { send('explored'); }\n  };\n})();\n\u003c/script>\n\u003cscript>/* Small optional author kit. Lessons own models, state, geometry, and gestures. */\nconst MotionKit = (() => {\n  const C = ['#eedbb6','#83d6d1','#b7a4e8','#d8a78b'];\n  const shapes = ['circle','square','triangle','diamond'];\n  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));\n  const smooth = x => x*x*(3-2*x);\n  const f = x => Number(x).toFixed(3);\n  const svg = body => `\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">${body}\u003c/svg>`;\n  function shape(kind,x,y,r,color=C[0],filled=true,opacity=1) {\n    const a=`fill=\"${filled?color:'none'}\" stroke=\"${color}\" stroke-width=\"${filled?.7:1.2}\" opacity=\"${opacity}\" stroke-linejoin=\"round\"`;\n    if(kind==='circle')return `\u003ccircle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"${r}\" ${a}/>`;\n    if(kind==='square')return `\u003crect x=\"${f(x-r)}\" y=\"${f(y-r)}\" width=\"${2*r}\" height=\"${2*r}\" rx=\"2.5\" ${a}/>`;\n    if(kind==='triangle')return `\u003cpath d=\"M${f(x)} ${f(y-r*1.15)}L${f(x+r)} ${f(y+r*.8)}L${f(x-r)} ${f(y+r*.8)}Z\" ${a}/>`;\n    return `\u003cpath d=\"M${f(x)} ${f(y-r*1.2)}L${f(x+r)} ${f(y)}L${f(x)} ${f(y+r*1.2)}L${f(x-r)} ${f(y)}Z\" ${a}/>`;\n  }\n  const icons={\n    play:svg('\u003cpath d=\"m18 10 20 14-20 14Z\" fill=\"currentColor\"/>'),\n    pause:svg('\u003cpath d=\"M18 12v24M30 12v24\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>'),\n    rewind:svg('\u003cpath d=\"M12 12a16 16 0 1 1-3 20M12 3v11H2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'),\n    example:svg('\u003crect x=\"5\" y=\"5\" width=\"27\" height=\"27\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" opacity=\".45\"/>\u003crect x=\"16\" y=\"16\" width=\"27\" height=\"27\" rx=\"8\" fill=\"#102230\" stroke=\"currentColor\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"2\" fill=\"currentColor\"/>\u003ccircle cx=\"35\" cy=\"35\" r=\"2\" fill=\"currentColor\"/>'),\n    silent:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM33 18l10 12M43 18 33 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>'),\n    sound:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM32 17q7 7 0 14M38 10q13 14 0 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>')\n  };\n  function create(spec) {\n    const $=id=>document.getElementById(id);\n    const stage=$('stage'),scene=$('scene'),objects=$('objects'),range=$('timeline'),play=$('play');\n    let w=640,h=500,frame=0,animation=null,drag=null,suppress=null,lastStatus='';\n    let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let audio=null,enabled=false;\n    const buttons=new Map();\n    $('lesson-title').textContent=spec.title;\n    $('lesson-description').textContent=spec.description;\n    $('lesson-glyph').innerHTML=spec.glyph;\n    $('rewind').innerHTML=icons.rewind;$('example').innerHTML=icons.example;$('sound').innerHTML=icons.silent;\n    function announce(text) {if(text!==lastStatus){$('status').textContent=text;lastStatus=text;}}\n    function stop(){animation=null;cancelAnimationFrame(frame);frame=0;play.innerHTML=icons.play;play.setAttribute('aria-label','Play the transformation');}\n    function paint(body,items=[]) {\n      scene.innerHTML=body;\n      const seen=new Set();\n      for(const item of items){\n        seen.add(item.key);let b=buttons.get(item.key);\n        if(!b){b=document.createElement('button');b.type='button';b.dataset.key=item.key;objects.appendChild(b);buttons.set(item.key,b);}\n        b.className=`piece ${item.kind||'token'}${drag?.key===item.key?' dragging':''}`;\n        b.style.left=`${item.x}px`;b.style.top=`${item.y}px`;\n        b.setAttribute('aria-label',item.label);\n        if(item.selected!==undefined)b.setAttribute('aria-pressed',String(item.selected));\n        const art=item.art??svg(shape(item.shape||'circle',24,24,11,item.color||C[0]));\n        if(b.dataset.art!==art){b.innerHTML=art;b.dataset.art=art;}\n      }\n      for(const [key,b] of buttons)if(!seen.has(key)){b.remove();buttons.delete(key);}\n    }\n    function render(){spec.render(api);range.value=String(clamp(spec.progress())*1000);range.setAttribute('aria-valuetext',spec.describe());}\n    function changed(){announce(spec.describe());MotionBridge.changed();}\n    function tone(index=0){\n      if(!enabled||!audio)return;\n      const time=audio.currentTime,osc=audio.createOscill
