n      drag.moved=true;spec.move?.(drag,p);render();\n    });\n    objects.addEventListener('pointerup',event=>{\n      if(!drag||drag.pointer!==event.pointerId)return;const ended=drag;drag=null;\n      try{ended.button.releasePointerCapture(ended.pointer);}catch{}\n      if(ended.moved){suppress=ended.key;spec.up?.(ended,point(event));render();changed();MotionBridge.explored();}\n    });\n    for(const name of ['pointercancel','lostpointercapture'])objects.addEventListener(name,event=>{if(drag?.pointer===event.pointerId){cancelDrag();changed();}});\n    objects.addEventListener('click',event=>{\n      const button=event.target.closest('button[data-key]');if(!button)return;\n      if(event.detail>0&&suppress===button.dataset.key){suppress=null;return;}\n      suppress=null;stop();spec.activate?.(button.dataset.key);render();changed();MotionBridge.explored();\n    });\n    objects.addEventListener('keydown',event=>{\n      const button=event.target.closest('button[data-key]');if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      if(spec.nudge){event.preventDefault();cancelDrag();stop();spec.nudge(button.dataset.key,['ArrowRight','ArrowUp'].includes(event.key)?1:-1,event.key);render();changed();}\n    });\n    play.addEventListener('click',()=>{cancelDrag();if(animation){stop();changed();return;}spec.play();render();MotionBridge.explored();});\n    $('rewind').addEventListener('click',()=>{cancelDrag();stop();spec.rewind();render();changed();});\n    $('example').addEventListener('click',()=>{cancelDrag();stop();spec.example();render();changed();tone(2);});\n    range.addEventListener('input',()=>{const p=Number(range.value)/1000;cancelDrag();stop();spec.scrub(p);render();});\n    range.addEventListener('change',()=>{spec.settle?.();render();changed();MotionBridge.explored();});\n    range.addEventListener('keydown',event=>{\n      if(!spec.step||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      event.preventDefault();cancelDrag();stop();spec.step(['ArrowRight','ArrowUp'].includes(event.key)?1:-1);render();changed();\n    });\n    $('sound').addEventListener('click',async()=>{\n      if(enabled){enabled=false;audio?.suspend();}else{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){announce('Optional sound is unavailable.');return;}try{audio||=new Audio();await audio.resume();enabled=true;tone(0);}catch{announce('Optional sound could not start.');return;}}\n      $('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Mute optional sound':'Enable optional sound');$('sound').innerHTML=icons[enabled?'sound':'silent'];\n    });\n    function pause(){cancelDrag();stop();if(enabled){enabled=false;audio?.suspend();$('sound').innerHTML=icons.silent;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable optional sound');}}\n    function resize(){cancelDrag();const r=stage.getBoundingClientRect();w=Math.max(260,r.width);h=Math.max(370,r.height);scene.setAttribute('viewBox',`0 0 ${w} ${h}`);render();}\n    const api={get w(){return w;},get h(){return h;},get reduced(){return reduced;},paint,render,tween,stop,changed,tone,announce,\n      examples(index,count){$('example-progress').innerHTML=Array.from({length:count},(_,i)=>`\u003cspan class=\"example-dot${i===index?' active':''}\">\u003c/span>`).join('');},\n      start(){stop();new ResizeObserver(resize).observe(stage);resize();MotionBridge.connect({snapshot:spec.snapshot,restore(value){pause();spec.restore(value);render();},pause});}\n    };\n    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();changed();}});\n    window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();stop();spec.escape?.();render();changed();}});\n    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduced=event.matches;if(reduced){pause();spec.settle?.();render();changed();}});\n    return api;\n  }\n  return {C,shapes,clamp,smooth,f,svg,shape,create};\n})();\n\u003c/script>\n\u003cscript>const SameModel = (() => {\n  const cases=[[[1,0,2],[0,2,1]],[[0,2,1],[2,1,0]],[[2,1,0],[1,0,2]]];\n  const identity=[0,1,2],compose=(a,b)=>a.map(x=>b[x]);\n  const equal=(a,b)=>a.every((x,i)=>x===b[i]);\n  const create=(seed=0)=>({version:1,seed,choice:0,progress:0});\n  const chain=s=>cases[s.seed%cases.length];\n  const target=s=>compose(...chain(s));\n  function choices(s){const [a,b]=chain(s),out=[compose(b,a),identity];out.splice(1+s.seed%2,0,target(s));return out;}\n  const solved=s=>equal(choices(s)[s.choice],target(s));\n  function restore(v){return v?.version===1&&Number.isInteger(v.seed)&&v.seed>=0&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice\u003c3&&Number.isFinite(v.progress)&&v.progress>=0&&v.progress\u003c=1?{version:1,seed:v.seed,choice:v.choice,progress:v.progress}:create();}\n  return{cases,identity,compose,equal,create,chain,target,choices,solved,restore};\n})();\nif(typeof module!=='undefined')module.exports=SameModel;\n\u003c/script>\n\u003cscript>/* Shared drawing primitive: recorded column-vector permutations, first then second. */\nconst MotionRoutes = (() => {\n  const {f,shape,C,svg}=MotionKit;\n  const xs=[.22,.5,.78];\n  function lanes(chain,input){const out=[input];for(const p of chain)out.push(p[out.at(-1)]);return out;}\n  function path(chain,input,box){\n    const track=lanes(chain,input),{x,y,w,h}=box,n=chain.length;\n    let d=`M${f(x+xs[input]*w)} ${f(y)}`;\n    for(let i=0;i\u003cn;i++){\n      const y0=y+h*(i+.18)/n,y1=y+h*(i+.82)/n;\n      const a=x+xs[track[i]]*w,b=x+xs[track[i+1]]*w;\n      d+=`L${f(a)} ${f(y0)}C${f(a)} ${f(y0+(y1-y0)/3)} ${f(b)} ${f(y1-(y1-y0)/3)} ${f(b)} ${f(y1)}`;\n    }\n    return d+`L${f(x+xs[track.at(-1)]*w)} ${f(y+h)}`;\n  }\n  function point(chain,input,t,box){\n    const track=lanes(chain,input),n=chain.length,p=MotionKit.clamp(t)*n,i=Math.min(n-1,Math.floor(p)),local=p-i;\n    const q=MotionKit.smooth(MotionKit.clamp((local-.18)/.64));\n    return{x:box.x+(xs[track[i]]+(xs[track[i+1]]-xs[track[i]])*q)*box.w,y:box.y+MotionKit.clamp(t)*box.h};\n  }\n  function card(perm){return svg(perm.map((_,i)=>`\u003cpath d=\"${path([perm],i,{x:0,y:5,w:48,h:38})}\" fill=\"none\" stroke=\"${C[i]}\" stroke-width=\"1.2\"/>`).join(''));}\n  function drawing(chain,t,box,{ghosts=null,complete=false,radius=10}={}){\n    let body='';\n    chain.forEach((_,i)=>{const y=box.y+box.h*(i+.18)/chain.length,h=box.h*.64/chain.length;body+=`\u003crect x=\"${f(box.x+box.w*.07)}\" y=\"${f(y-5)}\" width=\"${f(box.w*.86)}\" height=\"${f(h+10)}\" rx=\"15\" fill=\"${C[i%2+1]}\" fill-opacity=\".025\" stroke=\"${C[i%2+1]}\" stroke-opacity=\".32\"/>`;});\n    for(let i=0;i\u003c3;i++){\n      body+=`\u003cpath d=\"${path(chain,i,box)}\" fill=\"none\" stroke=\"${C[i]}\" stroke-width=\"1.3\" stroke-opacity=\".4\"/>`;\n      body+=`\u003ccircle cx=\"${f(box.x+xs[i]*box.w)}\" cy=\"${f(box.y+box.h)}\" r=\"${radius+7}\" fill=\"none\" stroke=\"${complete?C[1]:'#648896'}\" stroke-opacity=\".6\"/>`;\n      if(ghosts)body+=shape(MotionKit.shapes[ghosts[i]],box.x+xs[i]*box.w,box.y+box.h,radius+3,C[ghosts[i]],false,.4);\n    }\n    return body;\n  }\n  return{xs,lanes,path,point,card,drawing};\n})();\n\u003c/script>\n\u003cscript>(() => {\n  const M=SameModel,K=MotionKit,R=MotionRoutes;let s=M.create();\n  const set=p=>{s.progress=p;};\n  function choose(i){if(i!==s.choice)view.tween(s.progress,0,set,350,()=>{s.choice=i;view.render();view.tone(i);});}\n  function describe(){return s.progress\u003c1?'Compare two constructions on identical sets of three inputs. Choose a single operation on the right to match the two operations on the left.':M.solved(s)?'Both constructions agree on every input. The single mechanism has the same action as the pair.':'The constructions disagree. At least one input finishes on a different track.';}\n  const view=K.create({title:'Same',description:'Identical sets of three shapes travel through two constructions. The left uses two operations in succession. The right uses one chosen operation. Choose a lower tile and inspect all three outputs. Matching one example is not enough: these constructions must agree on every input in their three-element domain.',glyph:R.card([1,2,0]),describe,progress:()=>s.progress,snapshot:()=>({...s}),restore:v=>{s=M.restore(v);},\n    render(v){\n      const gap=v.w*.04,panel=(v.w-gap)/2,boxes=[{x:0,y:v.h*.12,w:panel,h:v.h*.60},{x:panel+gap,y:v.h*.12,w:panel,h:v.h*.60}],chains=[M.chain(s),[M.choices(s)[s.choice]]];\n      let body='',items=[];const radius=v.w\u003c450?7.8:11;\n      boxes.forEach((box,j)=>{\n        body+=R.drawing(chains[j],s.progress,box,{complete:s.progress===1&&M.solved(s),radius});\n        for(let i=0;i\u003c3;i++){const p=R.point(chains[j],i,s.progress,box);body+=K.shape(K.shapes[i],p.x,p.y,radius,K.C[i]);}\n      });\n      const spacing=Math.min(94,v.w*.28);\n      M.choices(s).forEach((p,i)=>items.push({key:`choice-${i}`,kind:'choice',x:v.w/2+(i-1)*spacing,y:v.h*.89,art:R.card(p),selected:s.choice===i,label:`Candidate ${i+1}: routes input tracks to ${p.map(x=>x+1).join(', ')}.`}));\n      v.paint(body,items);v.examples(s.seed%M.cases.length,M.cases.length);\n    },\n    play(){if(s.progress===1)view.tween(1,0,set,500,()=>view.tween(0,1,set,2900));else view.tween(s.progress,1,set,2900*(1-s.progress),()=>{if(M.solved(s))view.tone(3);});},\n    rewind(){view.tween(s.progress,0,set,550);},scrub:set,example(){s=M.create(s.seed+1);},activate(key){if(key.startsWith('choice-'))choose(Number(key.split('-')[1]));},nudge(key,dir){if(key.startsWith('choice-'))choose((s.choice+dir+3)%3);}\n  });view.start();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","connections":"\u003c!doctype html>\n\u003chtml lang=\"en\" data-lesson=\"connections\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#0a1420\">\u003ctitle>Connections \u00b7 Mathematics in Motion\u003c/title>\u003cstyle>:root{color-scheme:dark;--bg:#0a1420;--ink:#eedbb6;--aqua:#83d6d1;--violet:#b7a4e8;--line:#648896;--soft:#aec4cb}\n*{box-sizing:border-box}html,body{margin:0;min-width:280px;min-height:100%;background:var(--bg)}body{color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 35%,#152c3b, #0a1420 70%);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}button:focus-visible,input:focus-visible{outline:2px solid #f5e5bb;outline-offset:4px}button svg{width:100%;height:100%;pointer-events:none}svg{display:block}button:active{filter:brightness(1.2)}[hidden]{display:none!important}\n.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}\n#lesson-app{width:min(100%,1000px);height:100vh;height:100svh;min-height:570px;max-height:1000px;margin:auto;display:grid;grid-template-rows:64px minmax(370px,1fr) 132px;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}\n.lesson-header{display:flex;align-items:center;justify-content:center;position:relative}.lesson-glyph{width:34px;height:34px;opacity:.75}.lesson-header #sound{position:absolute;right:0;width:46px;height:46px;padding:13px;opacity:.6;border-radius:50%}.lesson-header #sound[aria-pressed=true]{opacity:1}\n#stage{position:relative;min-height:370px;isolation:isolate}#scene,#objects{position:absolute;inset:0;width:100%;height:100%}#scene{pointer-events:none;overflow:visible}#objects{pointer-events:none}.piece{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;pointer-events:auto  aria-label=\"Explore another example\">\u003c/button>\u003c/div>\n  \u003c/footer>\n  \u003cp id=\"lesson-description\" class=\"sr-only\">\u003c/p>\u003cp id=\"status\" class=\"sr-only\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\n\u003c/main>\n\n\u003cscript>/* Portable document contract v1. Parent identity is checked; no network access. */\nconst MotionBridge = (() => {\n  const channel = 'mathematics-in-motion/v1';\n  let hooks = null;\n  const lesson = document.documentElement.dataset.lesson;\n  const embedded = window.parent !== window;\n  if (embedded) document.documentElement.classList.add('embedded');\n  function send(type, extra = {}) {\n    if (embedded) window.parent.postMessage({channel, lesson, type, ...extra}, '*');\n  }\n  function changed() { if (hooks) send('state', {state: hooks.snapshot()}); }\n  window.addEventListener('message', event => {\n    if (!embedded || event.source !== window.parent || event.data?.channel !== channel || !hooks) return;\n    const data = event.data;\n    if (data.type === 'restore') {\n      if (data.state) hooks.restore(data.state);\n      changed();\n    } else if (data.type === 'pause') {\n      hooks.pause();\n      send('paused', {request: data.request, state: hooks.snapshot()});\n    }\n  });\n  return {\n    connect(value) { hooks = value; send('ready'); },\n    changed,\n    explored() { send('explored'); }\n  };\n})();\n\u003c/script>\n\u003cscript>/* Small optional author kit. Lessons own models, state, geometry, and gestures. */\nconst MotionKit = (() => {\n  const C = ['#eedbb6','#83d6d1','#b7a4e8','#d8a78b'];\n  const shapes = ['circle','square','triangle','diamond'];\n  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));\n  const smooth = x => x*x*(3-2*x);\n  const f = x => Number(x).toFixed(3);\n  const svg = body => `\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">${body}\u003c/svg>`;\n  function shape(kind,x,y,r,color=C[0],filled=true,opacity=1) {\n ey)?1:-1);render();changed();\n    });\n    $('sound').addEventListener('click',async()=>{\n      if(enabled){enabled=false;audio?.suspend();}else{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){announce('Optional sound is unavailable.');return;}try{audio||=new Audio();await audio.resume();enabled=true;tone(0);}catch{announce('Optional sound could not start.');return;}}\n      $('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Mute optional sound':'Enable optional sound');$('sound').innerHTML=icons[enabled?'sound':'silent'];\n    });\n    function pause(){cancelDrag();stop();if(enabled){enabled=false;audio?.suspend();$('sound').innerHTML=icons.silent;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable optional sound');}}\n    function resize(){cancelDrag();const r=stage.getBoundingClientRect();w=Math.max(260,r.width);h=Math.max(370,r.height);scene.setAttribute('viewBox',`0 0 ${w} ${h}`);render();}\n    const api={get w(){return w;},get h(){return h;},get reduced(){return reduced;},paint,render,tween,stop,changed,tone,announce,\n      examples(index,count){$('example-progress').innerHTML=Array.from({length:count},(_,i)=>`\u003cspan class=\"example-dot${i===index?' active':''}\">\u003c/span>`).join('');},\n      start(){stop();new ResizeObserver(resize).observe(stage);resize();MotionBridge.connect({snapshot:spec.snapshot,restore(value){pause();spec.restore(value);render();},pause});}\n    };\n    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();changed();}});\n    window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();stop();spec.escape?.();render();changed();}});\n    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduced=event.matches;if(reduced){pause();spec.settle?.();render();changed();}});\n    return api;\n  }\n  return {C,shapes,clamp,smooth,f,svg,shape,create};\n})();\n\u003c/script>\n\u003cscript>/* A[destination][source] is one directed arc, consistent with column vectors. */\nconst ConnectionsModel = (() => {\n  const cases=[{n:3,directed:false,edges:[[0,1]]},{n:3,directed:true,edges:[[0,1],[1,2],[2,0]]},{n:4,directed:false,edges:[[0,1],[1,2],[2,3],[3,0]]},{n:4,directed:true,edges:[[0,1],[0,2],[1,3],[2,3],[3,3]]}];\n  function create(seed=0){const c=cases[seed%cases.length],s={version:1,seed,directed:c.directed,matrix:Array.from({length:c.n},()=>Array(c.n).fill(0)),selected:null,focus:c.edges[0].slice(),progress:0};for(const [a,b] of c.edges){s.matrix[b][a]=1;if(!c.directed)s.matrix[a][b]=1;}return s;}\n  function toggle(s,src,dst){s.matrix[dst][src]=1-s.matrix[dst][src];if(!s.directed)s.matrix[src][dst]=s.matrix[dst][src];s.focus=[src,dst];s.selected=null;s.progress=0;}\n  function direct(s,on){if(!on)for(let r=0;r\u003cs.matrix.length;r++)for(let c=r+1;c\u003cs.matrix.length;c++)s.matrix[r][c]=s.matrix[c][r]=+(s.matrix[r][c]||s.matrix[c][r]);s.directed=on;s.selected=null;s.progress=0;}\n  function arcs(s){const out=[];for(let src=0;src\u003cs.matrix.length;src++)for(let dst=0;dst\u003cs.matrix.length;dst++)if(s.matrix[dst][src])out.push([src,dst]);return out;}\n  function restore(v){\n    if(v?.version!==1||!Number.isSafeInteger(v.seed)||v.seed\u003c0||typeof v.directed!=='boolean')return create();\n    const n=cases[v.seed%cases.length].n,valid=i=>Number.isInteger(i)&&i>=0&&i\u003cn;\n    if(!Array.isArray(v.matrix)||v.matrix.length!==n||!v.matrix.every(row=>Array.isArray(row)&&row.length===n&&row.every(x=>x===0||x===1))||!Number.isFinite(v.progress)||v.progress\u003c0||v.progress>1||(v.selected!==null&&!valid(v.selected))||!Array.isArray(v.focus)||v.focus.length!==2||!v.focus.every(valid))return create();\n    if(!v.directed&&v.matrix.some((row,r)=>row.some((x,c)=>x!==v.matrix[c][r])))return create();\n    return{version:1,seed:v.seed,directed:v.directed,matrix:v.matrix.map(row=>row.slice()),selected:v.selected,focus:v.focus.slice(),progress:v.progress};\n  }\n  return{cases,create,toggle,direct,arcs,restore};\n})();\nif(typeof module!=='undefined')module.exports=ConnectionsModel;\n\u003c/script>\n\u003cscript>/* Shared geometry only. Matrices consistently use destination rows, source columns. */\nconst RelationBoard = (() => {\n  const K=MotionKit,{f,shape,svg,C}=K;\n  function layout(w,h,n){\n    const wide=w>=620,cell=wide?Math.min(52,(w*.46-16)/(n+1)):48;\n    const size=(n+1)*cell,mx=wide?w*.73-size/2:(w-size)/2;\n    const my=wide?h*.43-size/2:h*.44;\n    return{wide,cell,mx,my,size,graph:{x:wide?0:16,y:wide?h*.08:8,w:wide?w*.47:w-32,h:wide?h*.69:h*.36},toolsY:h*.92};\n  }\n  const cellPoint=(g,row,col)=>({x:g.mx+(col+1.5)*g.cell,y:g.my+(row+1.5)*g.cell});\n  const sourcePoint=(g,col)=>({x:g.mx+(col+1.5)*g.cell,y:g.my+g.cell*.5});\n  const targetPoint=(g,row)=>({x:g.mx+g.cell*.5,y:g.my+(row+1.5)*g.cell});\n  function headers(g,n){\n    let body='';for(let i=0;i\u003cn;i++){const a=sourcePoint(g,i),b=targetPoint(g,i);body+=shape(K.shapes[i],a.x,a.y,8,C[i])+shape(K.shapes[i],b.x,b.y,8,C[i]);}\n    return body;\n  }\n  function ringNodes(box,n){\n    const r=Math.min(box.w*.32,box.h*.28),cx=box.x+box.w/2,cy=box.y+box.h*.53;\n    return Array.from({length:n},(_,i)=>{const a=-Math.PI/2+2*Math.PI*i/n;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};});\n  }\n  function edge(a,b,{loop=false,curved=false,directed=false}={}){\n    let p0,p1,p2,p3;\n    if(loop){p0={x:a.x-13,y:a.y-16};p1={x:a.x-60,y:a.y-76};p2={x:a.x+60,y:a.y-76};p3={x:a.x+13,y:a.y-16};}\n    else{\n      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,bend=curved?25:0;\n      p0={x:a.x+ux*22,y:a.y+uy*22};p3={x:b.x-ux*24,y:b.y-uy*24};\n      p1={x:p0.x+(p3.x-p0.x)/3-uy*bend,y:p0.y+(p3.y-p0.y)/3+ux*bend};\n      p2={x:p0.x+2*(p3.x-p0.x)/3-uy*bend,y:p0.y+2*(p3.y-p0.y)/3+ux*bend};\n    }\n    const path=`M${f(p0.x)} ${f(p0.y)}C${f(p1.x)} ${f(p1.y)} ${f(p2.x)} ${f(p2.y)} ${f(p3.x)} ${f(p3.y)}`;\n    function point(t){const q=1-t;return{x:q*q*q*p0.x+3*q*q*t*p1.x+3*q*t*t*p2.x+t*t*t*p3.x,y:q*q*q*p0.y+3*q*q*t*p1.y+3*q*t*t*p2.y+t*t*t*p3.y};}\n    let arrow='';if(directed){const near=point(.90),dx=p3.x-near.x,dy=p3.y-near.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;arrow=`M${f(p3.x)} ${f(p3.y)}L${f(p3.x-ux*9-uy*4)} ${f(p3.y-uy*9+ux*4)}L${f(p3.x-ux*9+uy*4)} ${f(p3.y-uy*9-ux*4)}Z`;}\n    return{path,point,arrow};\n  }\n  function line(e,color=C[1],opacity=.5,width=1.5){return `\u003cpath d=\"${e.path}\" fill=\"none\" stroke=\"${color}\" stroke-opacity=\"${opacity}\" stroke-width=\"${width}\"/>${e.arrow?`\u003cpath d=\"${e.arrow}\" fill=\"${color}\" fill-opacity=\"${opacity}\"/>`:''}`;}\n  const bead=(p,color=C[0],r=4)=>`\u003ccircle cx=\"${f(p.x)}\" cy=\"${f(p.y)}\" r=\"${r+4}\" fill=\"${color}\" fill-opacity=\".09\"/>\u003ccircle cx=\"${f(p.x)}\" cy=\"${f(p.y)}\" r=\"${r}\" fill=\"${color}\"/>`;\n  function matrixTrace(g,row,col,t){\n    const a=sourcePoint(g,col),b=cellPoint(g,row,col),c=targetPoint(g,row),p=t\u003c.5?{x:a.x,y:a.y+(b.y-a.y)*t*2}:{x:b.x+(c.x-b.x)*(t-.5)*2,y:b.y};\n    return `\u003cpath d=\"M${f(a.x)} ${f(a.y)}V${f(b.y)}H${f(c.x)}\" fill=\"none\" stroke=\"${C[col]}\" stroke-opacity=\".28\" stroke-width=\"1.4\"/>`+bead(p,C[col],3.3);\n  }\n  function presence(on,color,selected=false){return svg(`\u003crect x=\"3\" y=\"3\" width=\"42\" height=\"42\" rx=\"8\" fill=\"${color}\" fill-opacity=\"${on?.11:.015}\" stroke=\"${selected?'#eedbb6':'#648896'}\" stroke-opacity=\"${selected?.8:.22}\"/>${on?`\u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"${color}\"/>`:''}`);}\n  return{layout,cellPoint,sourcePoint,targetPoint,headers,ringNodes,edge,line,bead,matrixTrace,presence};\n})();\n\u003c/script>\n\u003cscript>(() => {\n  const M=ConnectionsModel,K=MotionKit,R=RelationBoard;let s=M.create(),nodes=[],ghost=null,hover=null;\n  const directed=K.svg('\u003ccircle cx=\"8\" cy=\"24\" r=\"4\" fill=\"#eedbb6\"/>\u003ccircle cx=\"40\" cy=\"24\" r=\"4\" fill=\"#83d6d1\"/>\u003cpath d=\"M14 24h19m-7-6 7 6-7 6\" stroke=\"#83d6d1\" fill=\"none\" stroke-width=\"1.6\"/>');\n  const undirected=K.svg('\u003ccircle cx=\"8\" cy=\"24\" r=\"4\" fill=\"#eedbb6\"/>\u003ccircle cx=\"40\" cy=\"24\" r=\"4\" fill=\"#83d6d1\"/>\u003cpath d=\"M14 24h20\" stroke=\"#83d6d1\" stroke-width=\"1.6\"/>');\n  const set=p=>{s.progress=p;};\n  const name=i=>K.shapes[i];\n  function describe(){const [a,b]=s.focus;return `${s.directed?'Directed':'Undirected'} connections. ${s.matrix.length} vertices. Columns are sources; rows are destinations. ${s.selected!==null?`${name(s.selected)} selected; choose another vertex to toggle a connection.`:`${name(a)} to ${name(b)}: ${s.matrix[b][a]?'connected':'not connected'}.`}`;}\n  function edit(a,b){M.toggle(s,a,b);ghost=null;hover=null;view.tone(b);if(s.matrix[b][a])view.tween(0,1,set,1100);}\n  function nearest(p){let best=null;nodes.forEach((q,i)=>{const d=Math.hypot(p.x-q.x,p.y-q.y);if(d\u003c35&&(!best||d\u003cbest.d))best={i,d};});return best?.i??null;}\n  function render(v){\n    const n=s.matrix.length,g=R.layout(v.w,v.h,n);nodes=R.ringNodes(g.graph,n);\n    const pair=ghost?.target!==null&&ghost?.target!==undefined?[ghost.src,ghost.target]:hover||s.focus;\n    let body=R.headers(g,n),items=[];\n    const arcs=M.arcs(s);for(const [a,b] of arcs){if(!s.directed&&a>b)continue;\n      const on=pair&&(pair[0]===a&&pair[1]===b||!s.directed&&pair[0]===b&&pair[1]===a);\n      const e=R.edge(nodes[a],nodes[b],{loop:a===b,curved:s.directed&&a!==b&&!!s.matrix[a][b],directed:s.directed});\n      body+=R.line(e,on?K.C[a]:'#648896',on?.95:.55,on?2:1.4);\n    }\n    if(ghost){const p=nodes[ghost.src];body+=`\u003cpath d=\"M${K.f(p.x)} ${K.f(p.y)}L${K.f(ghost.x)} ${K.f(ghost.y)}\" fill=\"none\" stroke=\"${K.C[ghost.src]}\" stroke-dasharray=\"3 6\" stroke-opacity=\".6\"/>`;}\n    for(let i=0;i\u003cn;i++)items.push({key:`node-${i}`,kind:'node',...nodes[i],shape:K.shapes[i],color:K.C[i],selected:s.selected===i,label:`${name(i)} vertex. Select it and another vertex, or drag to another vertex, to toggle their connection. Select it twice for a loop.`});\n    for(let row=0;row\u003cn;row++)for(let col=0;col\u003cn;col++){\n      const selected=pair&&pair[0]===col&&pair[1]===row;\n      items.push({key:`cell-${row}-${col}`,kind:'cell',...R.cellPoint(g,row,col),art:R.presence(s.matrix[row][col],K.C[col],selected),selected:!!s.matrix[row][col],label:`${name(col)} to ${name(row)}. ${s.matrix[row][col]?'Connected; remove':'Not connected; add'}${!s.directed&&row!==col?' both directions':''}.`});\n    }\n    const [a,b]=s.focus;\n    if(s.matrix[b][a]){\n      const e=R.edge(nodes[a],nodes[b],{loop:a===b,curved:s.directed&&a!==b&&!!s.matrix[a][b],directed:s.directed});\n      if(s.progress>0&&s.progress\u003c1)body+=R.bead(e.point(s.progress),K.C[a]);\n      body+=R.matrixTrace(g,b,a,s.progress);\n    }\n    items.push({key:'mode-undirected',kind:'mode',x:v.w/2-40,y:g.toolsY,art:undirected,selected:!s.directed,label:'Use undirected connections. Every existing arc becomes a two-way connection.'},{key:'mode-directed',kind:'mode',x:v.w/2+40,y:g.toolsY,art:directed,selected:s.directed,label:'Use directed connections. Each direction can be edited independently.'});\n    v.paint(body,items);v.examples(s.seed%M.cases.length,M.cases.length);\n  }\n  const view=K.create({title:'Connections',description:'One relationship is shown as connected shapes and as a matrix. Columns and rows carry the same shapes. Select two graph vertices or drag between them to edit a connection. Tap a matrix cell to edit that same connection. The arrow control makes connections directed; the plain-line control makes them undirected. Follow the probe from a source column down to its cell and across to its destination row.',glyph:directed,render,describe,progress:()=>s.progress,snapshot:()=>JSON.parse(JSON.stringify(s)),restore:v=>{s=M.restore(v);ghost=null;hover=null;},\n    scrub:set,rewind(){view.tween(s.progress,0,set,500);},play(){const [a,b]=s.focus;if(!s.matrix[b][a]){const first=M.arcs(s)[0];if(!first){view.announce('Add a connection to trace it.');return;}s.focus=first;}s.progress=0;view.tween(0,1,set,1700);},example(){s=M.create(s.seed+1);ghost=null;hover=null;},\n    activate(key){if(key.startsWith('cell-')){const [,r,c]=key.split('-').map(Number);edit(c,r);}else if(key.startsWith('node-')){const i=Number(key.split('-')[1]);if(s.selected===null)s.selected=i;else edit(s.selected,i);}else if(key.startsWith('mode-')){M.direct(s,key==='mode-directed');hover=null;}},\n    down(key){if(key.startsWith('node-'))return{src:Number(key.split('-')[1]),original:s.selected};return null;},\n    move(d,p){ghost={src:d.src,x:p.x,y:p.y,target:nearest(p)};},\n    up(d,p){const to=nearest(p);ghost=null;if(to!==null)edit(d.src,to);},cancel(d){ghost=null;s.selected=d.original;},escape(){s.selected=null;ghost=null;hover=null;}\n  });\n  const objects=document.getElementById('objects');\n  objects.addEventListener('pointerover',e=>{const b=e.target.closest('button[data-key]');if(b?.dataset.key.startsWith('cell-')){const [,r,c]=b.dataset.key.split('-').map(Number);hover=[c,r];view.render();}});\n  objects.addEventListener('pointerleave',()=>{hover=null;view.render();});\n  view.start();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","through":"\u003c!doctype html>\n\u003chtml lang=\"en\" data-lesson=\"through\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\u003cmeta name=\"theme-color\" content=\"#0a1420\">\u003ctitle>Through \u00b7 Mathematics in Motion\u003c/title>\u003cstyle>:root{color-scheme:dark;--bg:#0a1420;--ink:#eedbb6;--aqua:#83d6d1;--violet:#b7a4e8;--line:#648896;--soft:#aec4cb}\n*{box-sizing:border-box}html,body{margin:0;min-width:280px;min-height:100%;background:var(--bg)}body{color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 35%,#152c3b, #0a1420 70%) 00svh,844px);max-height:none;grid-template-rows:54px minmax(650px,1fr) 132px}.embedded #lesson-app{min-height:828px;grid-template-rows:42px minmax(650px,1fr) 128px}#stage{min-height:650px}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cmain id=\"lesson-app\">\n  \u003ch1 id=\"lesson-title\" class=\"sr-only\">\u003c/h1>\n  \u003cheader class=\"lesson-header\">\u003cdiv id=\"lesson-glyph\" class=\"lesson-glyph\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"sound\" type=\"button\" aria-label=\"Enable optional sound\" aria-pressed=\"false\">\u003c/button>\u003c/header>\n  \u003csection id=\"stage\" aria-labelledby=\"lesson-title\" aria-describedby=\"lesson-description\">\u003csvg id=\"scene\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003c/svg>\u003cdiv id=\"objects\">\u003c/div>\u003c/section>\n  \u003cfooter class=\"lesson-footer\">\n    \u003cdiv class=\"transport\">\u003cbutton id=\"play\" class=\"round-control\" type=\"button\" aria-label=\"Play the transformation\">\u003c/button>\u003clabel for=\"timeline\" class=\"sr-only\">Inspect the transformation\u003c/label>\u003cinput id=\"timeline\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"0\">\u003cbutton id=\"rewind\" class=\"quiet-control\" type=\"button\" aria-label=\"Return to the beginning\">\u003c/button>\u003c/div>\n    \u003cdiv class=\"tools\">\u003cdiv id=\"example-progress\" class=\"example-progress\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"example\" class=\"quiet-control\" type=\"button\" aria-label=\"Explore another example\">\u003c/button>\u003c/div>\n  \u003c/footer>\n  \u003cp id=\"lesson-description\" class=\"sr-only\">\u003c/p>\u003cp id=\"status\" class=\"sr-only\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\n\u003c/main>\n\n\u003cscript>/* Portable document contract v1. Parent identity is checked; no network access. */\nconst MotionBridge = (() => {\n  const channel = 'mathematics-in-motion/v1';\n  let hooks = null;\n  const lesson = document.documentElement.dataset.lesson;\n  const embedded = window.parent !== window;\n  if (embedded) document.documentElement.classList.add('embedded');\n  function send(type, extra = {}) {\n    if (embedded) window.parent.postMessage({channel, lesson, type, ...extra}, '*');\n  }\n  function changed() { if (hooks) send('state', {state: hooks.snapshot()}); }\n  window.addEventListener('message', event => {\n    if (!embedded || event.source !== window.parent || event.data?.channel !== channel || !hooks) return;\n    const data = event.data;\n    if (data.type === 'restore') {\n      if (data.state) hooks.restore(data.state);\n      changed();\n    } else if (data.type === 'pause') {\n      hooks.pause();\n      send('paused', {request: data.request, state: hooks.snapshot()});\n    }\n  });\n  return {\n    connect(value) { hooks = value; send('ready'); },\n    changed,\n    explored() { send('explored'); }\n  };\n})();\n\u003c/script>\n\u003cscript>/* Small optional author kit. Lessons own models, state, geometry, and gestures. */\nconst MotionKit = (() => {\n  const C = ['#eedbb6','#83d6d1','#b7a4e8','#d8a78b'];\n  const shapes = ['circle','square','triangle','diamond'];\n  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));\n  const smooth = x => x*x*(3-2*x);\n  const f = x => Number(x).toFixed(3);\n  const svg = body => `\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">${body}\u003c/svg>`;\n  function shape(kind,x,y,r,color=C[0],filled=true,opacity=1) {\n    const a=`fill=\"${filled?color:'none'}\" stroke=\"${color}\" stroke-width=\"${filled?.7:1.2}\" opacity=\"${opacity}\" stroke-linejoin=\"round\"`;\n    if(kind==='circle')return `\u003ccircle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"${r}\" ${a}/>`;\n    if(kind==='square')return `\u003crect x=\"${f(x-r)}\" y=\"${f(y-r)}\" width=\"${2*r}\" height=\"${2*r}\" rx=\"2.5\" ${a}/>`;\n    if(kind==='triangle')return `\u003cpath d=\"M${f(x)} ${f(y-r*1.15)}L${f(x+r)} ${f(y+r*.8)}L${f(x-r)} ${f(y+r*.8)}Z\" ${a}/>`;\n    return `\u003cpath d=\"M${f(x)} ${f(y-r*1.2)}L${f(x+r)} ${f(y)}L${f(x)} ${f(y+r*1.2)}L${f(x-r)} ${f(y)}Z\" ${a}/>`;\n  }\n  const icons={\n    play:svg('\u003cpath d=\"m18 10 20 14-20 14Z\" fill=\"currentColor\"/>'),\n    pause:svg('\u003cpath d=\"M18 12v24M30 12v24\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>'),\n    rewind:svg('\u003cpath d=\"M12 12a16 16 0 1 1-3 20M12 3v11H2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'),\n    example:svg('\u003crect x=\"5\" y=\"5\" width=\"27\" height=\"27\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" opacity=\".45\"/>\u003crect x=\"16\" y=\"16\" width=\"27\" height=\"27\" rx=\"8\" fill=\"#102230\" stroke=\"currentColor\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"2\" fill=\"currentColor\"/>\u003ccircle cx=\"35\" cy=\"35\" r=\"2\" fill=\"currentColor\"/>'),\n    silent:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM33 18l10 12M43 18 33 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>'),\n    sound:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM32 17q7 7 0 14M38 10q13 14 0 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>')\n  };\n  function create(spec) {\n    const $=id=>document.getElementById(id);\n    const stage=$('stage'),scene=$('scene'),objects=$('objects'),range=$('timeline'),play=$('play');\n    let w=640,h=500,frame=0,animation=null,drag=null,suppress=null,lastStatus='';\n    let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let audio=null,enabled=false;\n    const buttons=new Map();\n    $('lesson-title').textContent=spec.title;\n    $('lesson-description').textContent=spec.description;\n    $('lesson-glyph').innerHTML=spec.glyph;\n    $('rewind').innerHTML=icons.rewind;$('example').innerHTML=icons.example;$('sound').innerHTML=icons.silent;\n    function announce(text) {if(text!==lastStatus){$('status').textContent=text;lastStatus=text;}}\n    function stop(){animation=null;cancelAnimationFrame(frame);frame=0;play.innerHTML=icons.play;play.setAttribute('aria-label','Play the transformation');}\n    function paint(body,items=[]) {\n      scene.innerHTML=body;\n      const seen=new Set();\n      for(const item of items){\n        seen.add(item.key);let b=buttons.get(item.key);\n        if(!b){b=document.createElement('button');b.type='button';b.dataset.key=item.key;objects.appendChild(b);buttons.set(item.key,b);}\n        b.className=`piece ${item.kind||'token'}${drag?.key===item.key?' dragging':''}`;\n        b.style.left=`${item.x}px`;b.style.top=`${item.y}px`;\n        b.setAttribute('aria-label',item.label);\n        if(item.selected!==undefined)b.setAttribute('aria-pressed',String(item.selected));\n        const art=item.art??svg(shape(item.shape||'circle',24,24,11,item.color||C[0]));\n        if(b.dataset.art!==art){b.innerHTML=art;b.dataset.art=art;}\n      }\n      for(const [key,b] of buttons)if(!seen.has(key)){b.remove();buttons.delete(key);}\n    }\n    function render(){spec.render(api);range.value=String(clamp(spec.progress())*1000);range.setAttribute('aria-valuetext',spec.describe());}\n    function changed(){announce(spec.describe());MotionBridge.changed();}\n    function tone(index=0){\n      if(!enabled||!audio)return;\n      const time=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();\n      osc.frequency.value=[261.63,329.63,392,523.25][Math.abs(index)%4];\n      gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.045,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+.38);\n      osc.connect(gain);gain.connect(audio.destination);osc.start(time);osc.stop(time+.4);osc.onended=()=>{osc.disconnect();gain.disconnect();};\n    }\n    function tween(from,to,setter,duration=600,after=null){\n      stop();\n      if(reduced||Math.abs(to-from)\u003c1e-8){setter(to);render();after?.();changed();return;}\n      animation={from,to,setter,start:performance.now(),duration,after};\n      play.innerHTML=icons.pause;play.setAttribute('aria-label','Pause the transformation');\n      const tick=now=>{\n        if(!animation)return;const a=animation,t=clamp((now-a.start)/a.duration);\n        a.setter(t===1?a.to:a.from+(a.to-a.from)*smooth(t));render();\n        if(t===1){stop();a.after?.();changed();}else frame=requestAnimationFrame(tick);\n      };frame=requestAnimationFrame(tick);\n    }\n    function cancelDrag(){if(!drag)return;const old=drag;drag=null;spec.cancel?.(old);try{old.button.releasePointerCapture(old.pointer);}catch{}render();}\n    function point(event){const r=stage.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top};}\n    objects.addEventListener('pointerdown',event=>{\n      const button=event.target.closest('button[data-key]');if(!button||drag||event.button!==0)return;\n      stop();suppress=null;const p=point(event),key=button.dataset.key;\n      const detail=spec.down?.(key,p);if(!detail)return;\n      drag={...detail,key,button,pointer:event.pointerId,start:p,moved:false};\n      button.setPointerCapture(event.pointerId);render();\n    });\n    objects.addEventListener('pointermove',event=>{\n      if(!drag||drag.pointer!==event.pointerId)return;const p=point(event);\n      if(!drag.moved&&Math.hypot(p.x-drag.start.x,p.y-drag.start.y)\u003c3)return;\n      drag.moved=true;spec.move?.(drag,p);render();\n    });\n    objects.addEventListener('pointerup',event=>{\n      if(!drag||drag.pointer!==event.pointerId)return;const ended=drag;drag=null;\n      try{ended.button.releasePointerCapture(ended.pointer);}catch{}\n      if(ended.moved){suppress=ended.key;spec.up?.(ended,point(event));render();changed();MotionBridge.explored();}\n    });\n    for(const name of ['pointercancel','lostpointercapture'])objects.addEventListener(name,event=>{if(drag?.pointer===event.pointerId){cancelDrag();changed();}});\n    objects.addEventListener('click',event=>{\n      const button=event.target.closest('button[data-key]');if(!button)return;\n      if(event.detail>0&&suppress===button.dataset.key){suppress=null;return;}\n      suppress=null;stop();spec.activate?.(button.dataset.key);render();changed();MotionBridge.explored();\n    });\n    objects.addEventListener('keydown',event=>{\n      const button=event.target.closest('button[data-key]');if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      if(spec.nudge){event.preventDefault();cancelDrag();stop();spec.nudge(button.dataset.key,['ArrowRight','ArrowUp'].includes(event.key)?1:-1,event.key);render();changed();}\n    });\n    play.addEventListener('click',()=>{cancelDrag();if(animation){stop();changed();return;}spec.play();render();MotionBridge.explored();});\n    $('rewind').addEventListener('click',()=>{cancelDrag();stop();spec.rewind();render();changed();});\n    $('example').addEventListener('click',()=>{cancelDrag();stop();spec.example();render();changed();tone(2);});\n    range.addEventListener('input',()=>{const p=Number(range.value)/1000;cancelDrag();stop();spec.scrub(p);render();});\n    range.addEventListener('change',()=>{spec.settle?.();render();changed();MotionBridge.explored();});\n    range.addEventListener('keydown',event=>{\n      if(!spec.step||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;\n      event.preventDefault();cancelDrag();stop();spec.step(['ArrowRight','ArrowUp'].includes(event.key)?1:-1);render();changed();\n    });\n    $('sound').addEventListener('click',async()=>{\n      if(enabled){enabled=false;audio?.suspend();}else{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){announce('Optional sound is unavailable.');return;}try{audio||=new Audio();await audio.resume();enabled=true;tone(0);}catch{announce('Optional sound could not start.');return;}}\n      $('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Mute optional sound':'Enable optional sound');$('sound').innerHTML=icons[enabled?'sound':'silent'];\n    });\n    function pause(){cancelDrag();stop();if(enabled){enabled=false;audio?.suspend();$('sound').innerHTML=icons.silent;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable optional sound');}}\n    function resize(){cancelDrag();const r=stage.getBoundingClientRect();w=Math.max(260,r.width);h=Math.max(370,r.height);scene.setAttribute('viewBox',`0 0 ${w} ${h}`);render();}\n    const api={get w(){return w;},get h(){return h;},get reduced(){return reduced;},paint,render,tween,stop,changed,tone,announce,\n      examples(index,count){$('example-progress').innerHTML=Array.from({length:count},(_,i)=>`\u003cspan class=\"example-dot${i===index?' active':''}\">\u003c/span>`).join('');},\n      start(){stop();new ResizeObserver(resize).observe(stage);resize();MotionBridge.connect({snapshot:spec.snapshot,restore(value){pause();spec.restore(value);render();},pause});}\n    };\n    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();changed();}});\n    window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();stop();spec.escape?.();render();changed();}});\n    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduced=event.matches;if(reduced){pause();spec.settle?.();render();changed();}});\n    return api;\n  }\n  return {C,shapes,clamp,smooth,f,svg,shape,create};\n})();\n\u003c/script>\n\u003cscript>/* Two relations compose as C = B A, with destination rows and source columns. */\nconst ThroughModel = (() => {\n  const n=3,blank=()=>Array.from({length:n},()=>Array(n).fill(0));\n  const cases=[{a:[[0,0],[0,1],[1,1],[2,2]],b:[[0,2],[1,2],[2,0]]},{a:[[0,1],[1,2],[2,0]],b:[[0,2],[1,0],[2,1]]},{a:[[0,0],[0,1],[0,2],[1,2],[2,0]],b:[[0,0],[1,0],[2,0],[2,2]]}];\n  function create(seed=0){const c=cases[seed%cases.length],s={version:1,seed,a:blan :g.my+(row+1.5)*g.cell});\n  const sourcePoint=(g,col)=>({x:g.mx+(col+1.5)*g.cell,y:g.my+g.cell*.5});\n  const targetPoint=(g,row)=>({x:g.mx+g.cell*.5,y:g.my+(row+1.5)*g.cell});\n  function headers(g,n){\n    let body='';for(let i=0;i\u003cn;i++){const a=sourcePoint(g,i),b=targetPoint(g,i);body+=shape(K.shapes[i],a.x,a.y,8,C[i])+shape(K.shapes[i],b.x,b.y,8,C[i]);}\n    return body;\n  }\n  function ringNodes(box,n){\n    const r=Math.min(box.w*.32,box.h*.28),cx=box.x+box.w/2,cy=box.y+box.h*.53;\n    return Array.from({length:n},(_,i)=>{const a=-Math.PI/2+2*Math.PI*i/n;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};});\n  }\n  function edge(a,b,{loop=false,curved=false,directed=false}={}){\n    let p0,p1,p2,p3;\n    if(loop){p0={x:a.x-13,y:a.y-16};p1={x:a.x-60,y:a.y-76};p2={x:a.x+60,y:a.y-76};p3={x:a.x+13,y:a.y-16};}\n    else{\n      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,bend=curved?25:0;\n      p0={x:a.x+ux*22,y:a.y+uy*22};p3={x:b.x-ux*24,y:b.y-uy*24};\n      p1={x:p0.x+(p3.x-p0.x)/3-uy*bend,y:p0.y+(p3.y-p0.y)/3+ux*bend};\n      p2={x:p0.x+2*(p3.x-p0.x)/3-uy*bend,y:p0.y+2*(p3.y-p0.y)/3+ux*bend};\n    }\n    const path=`M${f(p0.x)} ${f(p0.y)}C${f(p1.x)} ${f(p1.y)} ${f(p2.x)} ${f(p2.y)} ${f(p3.x)} ${f(p3.y)}`;\n    function point(t){const q=1-t;return{x:q*q*q*p0.x+3*q*q*t*p1.x+3*q*t*t*p2.x+t*t*t*p3.x,y:q*q*q*p0.y+3*q*q*t*p1.y+3*q*t*t*p2.y+t*t*t*p3.y};}\n    let arrow='';if(directed){const near=point(.90),dx=p3.x-near.x,dy=p3.y-near.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;arrow=`M${f(p3.x)} ${f(p3.y)}L${f(p3.x-ux*9-uy*4)} ${f(p3.y-uy*9+ux*4)}L${f(p3.x-ux*9+uy*4)} ${f(p3.y-uy*9-ux*4)}Z`;}\n    return{path,point,arrow};\n  }\n  function line(e,color=C[1],opacity=.5,width=1.5){return `\u003cpath d=\"${e.path}\" fill=\"none\" stroke=\"${color}\" stroke-opacity=\"${opacity}\" stroke-width=\"${width}\"/>${e.arrow?`\u003cpath d=\"${e.arrow}\" fill=\"${color}\" fill-opacity=\"${opacity}\"/>`:''}`;}\n  const bead=(p,color=C[0],r=4)=>`\u \"26\" fill=\"none\" stroke=\"${K.C[i]}\" stroke-opacity=\".6\"/>`;\n      items.push({key:`node-${l}-${i}`,kind:'node',...p,shape:K.shapes[i],color:K.C[i],selected:s.selected?.[0]===l&&s.selected?.[1]===i,label:`${['Source','Intermediate','Destination'][l]} ${K.shapes[i]}. Select or drag to a vertex in the next column to edit a connection.`});\n    }));\n    for(const middle of ws){const first=R.edge(nodes[0][src],nodes[1][middle],{directed:true}),second=R.edge(nodes[1][middle],nodes[2][dst],{directed:true});const p=s.progress\u003c.5?first.point(s.progress*2):second.point((s.progress-.5)*2);if(s.progress>0&&s.progress\u003c1)body+=R.bead(p,K.C[middle],4);}\n    for(let row=0;row\u003c3;row++)for(let col=0;col\u003c3;col++){const witness=M.witnesses(s,col,row);items.push({key:`cell-${row}-${col}`,kind:'cell',...R.cellPoint(g,row,col),art:cellArt(witness,src===col&&dst===row),selected:src===col&&dst===row,label:`Inspect ${witness.length} two-step routes from ${K.shapes[col]} to ${K.shapes[row]}${witness.length?', through '+witness.map(k=>K.shapes[k]).join(' or '):''}. This result is computed from the connections.`});}\n    items.push({key:'mode-witnesses',kind:'mode',x:v.w/2-40,y:g.toolsY,art:dotIcon,selected:!s.heat,label:'Show the intermediate shapes, one for each two-step route.'},{key:'mode-heat',kind:'mode',x:v.w/2+40,y:g.toolsY,art:heatIcon,selected:s.heat,label:'Show route counts as brightness. Empty means zero; maximum brightness means three routes.'});\n    v.paint(body,items);v.examples(s.seed%M.cases.length,M.cases.length);\n  }\n  const view=K.create({title:'Through',description:'Three columns show source, intermediate, and destination copies of the same three shapes. Connections between adjacent columns are editable by selecting endpoints or dragging. Every intermediate shape that completes a two-step route contributes once to the result matrix. Tap a result cell to trace all its alternatives. Switch between intermediate-shape marks and brightness. The ;z-index:4;border:1px solid #64889644;border-radius:15px;cursor:pointer}.piece.camera svg{width:31px;height:31px;filter:none}.piece.camera:hover{background:#83d6d10b}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cmain id=\"lesson-app\">\n  \u003ch1 id=\"lesson-title\" class=\"sr-only\">\u003c/h1>\n  \u003cheader class=\"lesson-header\">\u003cdiv id=\"lesson-glyph\" class=\"lesson-glyph\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"sound\" type=\"button\" aria-label=\"Enable optional sound\" aria-pressed=\"false\">\u003c/button>\u003c/header>\n  \u003csection id=\"stage\" aria-labelledby=\"lesson-title\" aria-describedby=\"lesson-description\">\u003csvg id=\"scene\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003c/svg>\u003cdiv id=\"objects\">\u003c/div>\u003c/section>\n  \u003cfooter class=\"lesson-footer\">\n    \u003cdiv class=\"transport\">\u003cbutton id=\"play\" class=\"round-control\" type=\"button\" aria-label=\"Play the transformation\">\u003c/button>\u003clabel for=\"timeline\" class=\"sr-only\">Inspect the transformation\u003c/label>\u003cinput id=\"timeline\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"0\">\u003cbutton id=\"rewind\" class=\"quiet-control\" type=\"button\" aria-label=\"Return to the beginning\">\u003c/button>\u003c/div>\n    \u003cdiv class=\"tools\">\u003cdiv id=\"example-progress\" class=\"example-progress\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"example\" class=\"quiet-control\" type=\"button\" aria-label=\"Explore another example\">\u003c/button>\u003c/div>\n  \u003c/footer>\n  \u003cp id=\"lesson-description\" class=\"sr-only\">\u003c/p>\u003cp id=\"status\" class=\"sr-only\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/p>\n\u003c/main>\n\n\u003cscript>const foldWorld=document.createElement(\"div\");foldWorld.id=\"fold-world\";document.getElementById(\"stage\").appendChild(foldWorld);\u003c/script>\n\u003cscript>/* Portable document contract v1. Parent identity is checked; no network access. */\nconst MotionBridge = (() => {\n  const channel = 'mathematics-in-motion/v1';\n  let hooks = null;\n  const lesson = document.documentElement.dataset.lesson;\n  const embedded = window.parent !== window;\n  if (embedded) document.documentElement.classList.add('embedded');\n  function send(type, extra = {}) {\n    if (embedded) window.parent.postMessage({channel, lesson, type, ...extra}, '*');\n  }\n  function changed() { if (hooks) send('state', {state: hooks.snapshot()}); }\n  window.addEventListener('message', event => {\n    if (!embedded || event.source !== window.parent || event.data?.channel !== channel || !hooks) return;\n    const data = event.data;\n    if (data.type === 'restore') {\n      if (data.state) hooks.restore(data.state);\n      changed();\n    } else if (data.type === 'pause') {\n      hooks.pause();\n      send('paused', {request: data.request, state: hooks.snapshot()});\n    }\n  });\n  return {\n    connect(value) { hooks = value; send('ready'); },\n    changed,\n    explored() { send('explored'); }\n  };\n})();\n\u003c/script>\n\u003cscript>/* Small optional author kit. Lessons own models, state, geometry, and gestures. */\nconst MotionKit = (() => {\n  const C = ['#eedbb6','#83d6d1','#b7a4e8','#d8a78b'];\n  const shapes = ['circle','square','triangle','diamond'];\n  const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));\n  const smooth = x => x*x*(3-2*x);\n  const f = x => Number(x).toFixed(3);\n  const svg = body => `\u003csvg viewBox=\"0 0 48 48\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">${body}\u003c/svg>`;\n  function shape(kind,x,y,r,color=C[0],filled=true,opacity=1) {\n    const a=`fill=\"${filled?color:'none'}\" stroke=\"${color}\" stroke-width=\"${filled?.7:1.2}\" opacity=\"${opacity}\" stroke-linejoin=\"round\"`;\n    if(kind==='circle')return `\u003ccircle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"${r}\" ${a}/>`;\n    if(kind==='square')return `\u003crect x=\"${f(x-r)}\" y=\"${f(y-r)}\" width=\"${2*r}\" height=\"${2*r}\" rx=\"2.5\" ${a}/>`;\n    if(kind==='triangle')return `\u003cpath d=\"M${f(x)} ${f(y-r*1.15)}L${f(x+r)} ${f(y+r*.8)}L${f(x-r)} ${f(y+r*.8)}Z\" ${a}/>`;\n    return `\u003cpath d=\"M${f(x)} ${f(y-r*1.2)}L${f(x+r)} ${f(y)}L${f(x)} ${f(y+r*1.2)}L${f(x-r)} ${f(y)}Z\" ${a}/>`;\n  }\n  const icons={\n    play:svg('\u003cpath d=\"m18 10 20 14-20 14Z\" fill=\"currentColor\"/>'),\n    pause:svg('\u003cpath d=\"M18 12v24M30 12v24\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>'),\n    rewind:svg('\u003cpath d=\"M12 12a16 16 0 1 1-3 20M12 3v11H2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'),\n    example:svg('\u003crect x=\"5\" y=\"5\" width=\"27\" height=\"27\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" opacity=\".45\"/>\u003crect x=\"16\" y=\"16\" width=\"27\" height=\"27\" rx=\"8\" fill=\"#102230\" stroke=\"currentColor\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"2\" fill=\"currentColor\"/>\u003ccircle cx=\"35\" cy=\"35\" r=\"2\" fill=\"currentColor\"/>'),\n    silent:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM33 18l10 12M43 18 33 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>'),\n    sound:svg('\u003cpath d=\"M7 18h7l10-8v28l-10-8H7ZM32 17q7 7 0 14M38 10q13 14 0 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>')\n  };\n  function create(spec) {\n    const $=id=>document.getElementById(id);\n    const stage=$('stage'),scene=$('scene'),objects=$('objects'),range=$('timeline'),play=$('play');\n    let w=640,h=500,frame=0,animation=null,drag=null,suppress=null,lastStatus='';\n    let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let audio=null,enabled=false;\n    const buttons=new Map();\n    $('lesson-title').textContent=spec.title;\n    $('lesson-description').textContent=spec.description;\n    $('lesson-glyph').innerHTML=spec.glyph;\n    $('rewind').innerHTML=icons.rewind;$('example').innerHTML=icons.example;$('sound').innerHTML=icons.silent;\n    function announce(text) {if(text!==lastStatus){$('status').textContent=text;lastStatus=text;}}\n    function stop(){animation=null;cancelAnimationFrame(frame);frame=0;play.innerHTML=icons.play;play.setAttribute('aria-label','Play the transformation');}\n    function paint(body,items=[]) {\n      scene.innerHTML=body;\n      const seen=new Set();\n      for(const item of items){\n        seen.add(item.key);let b=buttons.get(item.key);\n        if(!b){b=document.createElement('button');b.type='button';b.dataset.key=item.key;objects.appendChild(b);buttons.set(item.key,b);}\n        b.className=`piece ${item.kind||'token'}${drag?.key===item.key?' dragging':''}`;\n        b.style.left=`${item.x}px`;b.style.top=`${item.y}px`;\n        b.setAttribute('aria-label',item.label);\n        if(item.selected!==undefined)b.setAttribute('aria-pressed',String(item.selected));\n        const art=item.art??svg(shape(item.shape||'circle',24,24,11,item.color||C[0]));\n        if(b.dataset.art!==art){b.innerHTML=art;b.dataset.art=art;}\n      }\n      for(const [key,b] of buttons)if(!seen.has(key)){b.remove();buttons.delete(key);}\n    }\n    function render(){spec.render(api);range.value=String(clamp(spec.progress())*1000);range.setAttribute('aria-valuetext',spec.describe());}\n    function changed(){announce(spec.describe());MotionBridge.changed();}\n    function tone(index=0){\n      if(!enabled||!audio)return;\n      const time=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();\n      osc.frequency.value=[261.63,329.63,392,523.25][Math.abs(index)%4];\n      gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.045,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+.38);\n      osc.connect(gain);gain.connect(audio.destination);osc.start(time);osc.stop(time+.4);osc.onended=()=>{osc.disconnect();gain.disconnect();};\n    }\n    function tween(from,to, nounce('Optional sound could not start.');return;}}\n      $('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Mute optional sound':'Enable optional sound');$('sound').innerHTML=icons[enabled?'sound':'silent'];\n    });\n    function pause(){cancelDrag();stop();if(enabled){enabled=false;audio?.suspend();$('sound').innerHTML=icons.silent;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable optional sound');}}\n    function resize(){cancelDrag();const r=stage.getBoundingClientRect();w=Math.max(260,r.width);h=Math.max(370,r.height);scene.setAttribute('viewBox',`0 0 ${w} ${h}`);render();}\n    const api={get w(){return w;},get h(){return h;},get reduced(){return reduced;},paint,render,tween,stop,changed,tone,announce,\n      examples(index,count){$('example-progress').innerHTML=Array.from({length:count},(_,i)=>`\u003cspan class=\"example-dot${i===index?' active':''}\">\u003c/span>`).join('');},\n      start(){stop();new ResizeObserver(resize).observe(stage);resize();MotionBridge.connect({snapshot:spec.snapshot,restore(value){pause();spec.restore(value);render();},pause});}\n    };\n    document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();changed();}});\n    window.addEventListener('keydown',event=>{if(event.key==='Escape'){cancelDrag();stop();spec.escape?.();render();changed();}});\n    matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduced=event.matches;if(reduced){pause();spec.settle?.();render();changed();}});\n    return api;\n  }\n  return {C,shapes,clamp,smooth,f,svg,shape,create};\n})();\n\u003c/script>\n\u003cscript>/* Rigid unit-square faces, rotated about exact shared edges. No physics engine. */\nconst FoldModel = (() => {\n  const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x);};\n  const create=(seed=0)=>({version:1,seed,progress:0,yaw:-.52,pitch:.75});\n  const sub=(a,b)=>a.map((x,i)=>x-b[i]);\n  const add=(a,b)=>a.map((x,i)=>x+b[i]);\n  const dot=(a,b)=>a.reduce((n,x,i)=>n+x*b[i],0);\n  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];\n  function rotateX(p,hinge,a){const q=sub(p,hinge),c=Math.cos(a),s=Math.sin(a);return add([q[0],c*q[1]-s*q[2],s*q[1]+c*q[2]],hinge);}\n  function rotateY(p,hinge,a){const q=sub(p,hinge),c=Math.cos(a),s=Math.sin(a);return add([c*q[0]+s*q[2],q[1],-s*q[0]+c*q[2]],hinge);}\n  const square=(x,y)=>[[x-.5,y-.5,0],[x+.5,y-.5,0],[x+.5,y+.5,0],[x-.5,y+.5,0]];\n  function pose(seed,progress){\n    const which=seed%3,p=clamp(progress),a=(which===2?smooth(p/.62):smooth(p))*Math.PI/2,b=which===2?smooth((p-.62)/.38)*Math.PI/2:0;\n    const faces=[{id:0,vertices:square(0,0)},{id:1,vertices:square(0,1).map(q=>rotateX(q,[0,.5,0],a))}];\n    if(which>0){faces.push({id:2,vertices:square(1,0).map(q=>rotateY(q,[.5,0,0],-a))},{id:3,vertices:square(0,-1).map(q=>rotateX(q,[0,-.5,0],-a))},{id:4,vertices:square(-1,0).map(q=>rotateY(q,[-.5,0,0],a))});}\n    if(which===2)faces.push({id:5,vertices:square(0,2).map(q=>rotateX(rotateX(q,[0,1.5,0],b),[0,.5,0],a))});\n    return faces;\n  }\n  function grip(seed,progress){const v=pose(seed,progress).at(seed%3===2?-1:1).vertices;return v[2].map((x,i)=>(x+v[3][i])/2);}\n  function camera(p,yaw,pitch){const c=Math.cos(yaw),s=Math.sin(yaw),y=s*p[0]+c*p[1];return[c*p[0]-s*p[1],-Math.sin(pitch)*y-Math.cos(pitch)*p[2],-Math.cos(pitch)*y+Math.sin(pitch)*p[2]];}\n  function frame(seed,yaw,pitch,w,h){\n    const xs=[],ys=[];for(let i=0;i\u003c=80;i++)for(const face of pose(seed,i/80))for(const p of face.vertices){const q=camera(p,yaw,pitch);xs.push(q[0]);ys.push(q[1]);}\n    const loX=Math.min(...xs),hiX=Math.max(...xs),loY=Math.min(...ys),hiY=Math.max(...ys);\n    const scale=Math.min((w-76)/(hiX-loX),(h*.80-68)/(hiY-loY),150);\n    return{scale,x:w/2-(loX+hiX)/2*scale,y:h*.43-(loY+hiY)/2*scale};\n  }\n  function project(p,s,fit){const q=camera(p,s.yaw,s.pitch) 24\" cy=\"24\" r=\"11\" fill=\"#102735\" stroke=\"#83d6d1\" stroke-width=\"1.2\"/>\u003ccircle cx=\"24\" cy=\"24\" r=\"3.5\" fill=\"#eedbb6\"/>');\n  const set=p=>{s.progress=p;};\n  function describe(){const which=s.seed%3,count=[2,5,6][which],phase=s.progress===0?'flat':s.progress===1?['a right-angle hinge','an open box','a closed cube'][which]:'partly folded';return `${count} persistent square faces, ${phase}. Each face stays rigid while the shared edges act as hinges. Drag the glowing handle to fold, drag the object to turn the view, or use the time control. Focus the view and use arrow keys to orbit; focus the handle and use arrow keys to fold.`;}\n  function material(face){const [a,b,,d]=face.vertices,n=M.cross(M.sub(b,a),M.sub(d,a)),light=[.36,-.48,.8],shade=.35+.27*Math.abs(M.dot(n,light)),base=K.C[face.id%3];const rgb=[1,3,5].map(i=>parseInt(base.slice(i,i+2),16));return rgb.map(x=>Math.round(12+x*shade));}\n  function render(v){\n    const key=[s.seed%3,s.yaw,s.pitch,v.w,v.h].join(',');if(key!==fitKey){fit=M.frame(s.seed,s.yaw,s.pitch,v.w,v.h);fitKey=key;}\n    const faces=M.pose(s.seed,s.progress),seen=new Set();\n    for(const face of faces){\n      seen.add(face.id);let el=planes.get(face.id);if(!el){el=document.createElement('div');el.className='fold-face';el.dataset.face=String(face.id);el.setAttribute('aria-hidden','true');el.innerHTML=K.svg(K.shape(K.shapes[face.id%3],24,24,10,K.C[face.id%3],face.id\u003c3));world.appendChild(el);planes.set(face.id,el);}\n      const rgb=material(face),darker=rgb.map(x=>Math.round(x*.8));el.style.width=`${fit.scale}px`;el.style.height=`${fit.scale}px`;el.style.transform=`matrix3d(${M.cssMatrix(face,s,fit).join(',')})`;el.style.background=`linear-gradient(145deg,rgb(${rgb.join(',')}),rgb(${darker.join(',')}))`;el.style.borderColor=K.C[face.id%3]+'99';\n    }\n    for(const [id,el] of planes)if(!seen.has(id)){el.remove();planes.delete(id);}\n    let body='';if(showArc){const pts=Array.from({length:65},(_,i)=>M.project <script>/* Pure catalog policy. Relationships are suggestions, never access locks. */
const CatalogModel = (() => {
  function ordered(catalog){
    const output=[],seen=new Set();
    function visit(item){if(seen.has(item.id))return;seen.add(item.id);for(const id of item.builds_on)visit(catalog.find(x=>x.id===id));output.push(item);}
    for(const item of [...catalog].sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id)))visit(item);
    return output;
  }
  function layout(catalog,page,width){
    const entries=ordered(catalog).slice(page*9,page*9+9),ids=new Set(entries.map(x=>x.id)),depth=new Map(),rows=[],columns=width<360?2:3;
    for(const item of entries){let d=Math.max(-1,...item.builds_on.filter(id=>ids.has(id)).map(id=>depth.get(id)??0))+1;while((rows[d]?.length||0)>=columns)d++;(rows[d]??=[]).push(item);depth.set(item.id,d);}
    const nodes=[];rows.forEach((row,d)=>row.forEach((item,i)=>nodes.push({id:item.id,x:width*(i+1)/(row.length+1),y:66+d*114})));
    const height=Math.max(320,132+(rows.length-1)*114),byId=new Map(nodes.map(n=>[n.id,n])),edges=[];
    for(const item of entries){for(const from of item.builds_on)if(ids.has(from))edges.push({from,to:item.id,type:'builds_on'});for(const other of item.related)if(ids.has(other)&&item.id<other)edges.push({from:item.id,to:other,type:'related'});}
    return{nodes,edges,height,byId,pages:Math.ceil(catalog.length/9)};
  }
  function opening(catalog){const marked=catalog.filter(x=>Number.isInteger(x.opening_order));return marked.length?[...marked].sort((a,b)=>a.opening_order-b.opening_order):ordered(catalog).slice(0,4);}
  function openingLayout(catalog,width){
    const entries=opening(catalog),offset=Math.min(58,(width-152)/2),nodes=entries.map((item,i)=>({id:item.id,x:width/2+(i%2?offset:-offset),y:66+i*114}));
    return{nodes,edges:nodes.slice(1).map((n,i)=>({from:nodes[i].id,to:n.id,type:'opening'})),height:Math.max(320,132+(nodes.length-1)*114),byId:new Map(nodes.map(n=>[n.id,n])),pages:1};
  }
  function next(catalog,active){const path=opening(catalog);if(!active)return path[0]||null;const i=path.findIndex(x=>x.id===active);if(i>=0)return path[i+1]||null;return ordered(catalog).find(x=>x.builds_on.includes(active)&&!path.some(p=>p.id===x.id))||null;}
  return{ordered,layout,opening,openingLayout,next};
})();
if(typeof module!=='undefined')module.exports=CatalogModel;
</script>
<script>(() => {
  const $=id=>document.getElementById(id),channel='mathematics-in-motion/v1';
  const catalog=MotionCatalog,byId=new Map(catalog.map(x=>[x.id,x]));
  const states=new Map(),visited=new Set();let active=null,frame=null,page=0,mapOpen=true,scope='opening',operation=0,requestId=0;
  const pending=new Map();
  const art=body=>`<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;
  const nextIcon=art('<path d="m15 9 11 11-11 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>');
  const atlasIcon=art('<path d="M20 7 8 29M20 7 32 29M8 29h24" stroke="#648896"/><circle cx="20" cy="7" r="4" fill="#0a1420" stroke="#eedbb6"/><circle cx="8" cy="29" r="4" fill="#0a1420" stroke="#83d6d1"/><circle cx="32" cy="29" r="4" fill="#0a1420" stroke="#b7a4e8"/>');
  const pathIcon=art('<path d="M14 7c0 7 12 6 12 13s-12 6-12 13" stroke="#648896"/><circle cx="14" cy="7" r="3" fill="#eedbb6"/><circle cx="26" cy="20" r="3" fill="#83d6d1"/><circle cx="14" cy="33" r="3" fill="#b7a4e8"/>');
  $('map-button').innerHTML=atlasIcon;
  $('continue-button').innerHTML=nextIcon;$('map-next').innerHTML=nextIcon;$('map-prev').innerHTML=art('<path d="m25 9-11 11 11 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>');
  try{const saved=JSON.parse(localStorage.getItem('motion-visits-v1')||'[]');if(Array.isArray(saved))saved.filter(id=>byId.has(id)).forEach(id=>visited.add(id));}catch{}
  function persist(){try{localStorage.setItem('motion-visits-v1',JSON.stringify([...visited]));}catch{}}
  const nextLesson=()=>CatalogModel.next(catalog,active);
  function updateChrome(){const next=nextLesson();$('current-glyph').innerHTML=active?byId.get(active).glyph:'';$('continue-button').disabled=false;$('continue-button').innerHTML=next?nextIcon:atlasIcon;$('continue-button').setAttribute('aria-label',next?`Explore ${next.title}`:'Explore the complete lesson constellation');$('map-button').disabled=mapOpen&&!active;$('map-button').setAttribute('aria-expanded',String(mapOpen));$('map-button').setAttribute('aria-label',mapOpen&&active?'Return to the current lesson':'Open the lesson menu');$('scope-button').innerHTML=scope==='opening'?atlasIcon:pathIcon;$('scope-button').setAttribute('aria-label',scope==='opening'?'Explore all lessons in the complete constellation':'Return to the small opening path');}
  function drawMap(){
    const w=Math.max(264,$('map-field').getBoundingClientRect().width),g=scope==='opening'?CatalogModel.openingLayout(catalog,w):CatalogModel.layout(catalog,page,w);
    $('lesson-map').setAttribute('aria-label',scope==='opening'?'Opening path':'Complete lesson constellation');
    $('map-description').textContent=scope==='opening'?'A small suggested path through familiar actions. Each symbol opens a lesson. The constellation control reveals every lesson, all available immediately. A visit is not an assessment.':'Solid paths suggest what builds on what; dotted paths connect related ideas. Every lesson is available. Use the path control to return to the small opening sequence.';
    $('map-field').style.height=`${g.height}px`;$('map-links').setAttribute('viewBox',`0 0 ${w} ${g.height}`);
    $('map-links').innerHTML=g.edges.map(e=>{const a=g.byId.get(e.from),b=g.byId.get(e.to);return `<path d="M${a.x} ${a.y} C${a.x} ${(a.y+b.y)/2} ${b.x} ${(a.y+b.y)/2} ${b.x} ${b.y}" fill="none" stroke="${e.type==='related'?'#b7a4e8':'#648896'}" stroke-opacity="${e.type==='related'?'.28':'.5'}" stroke-width="1.2" ${e.type==='related'?'stroke-dasharray="2 7"':''}/>`;}).join('');
    const old=new Map([...$('map-nodes').children].map(n=>[n.dataset.lesson,n])),keep=new Set();
    for(const p of g.nodes){const item=byId.get(p.id);let b=old.get(p.id);if(!b){b=document.createElement('button');b.type='button';b.dataset.lesson=p.id;b.innerHTML=item.glyph;b.addEventListener('click',()=>openLesson(item.id));$('map-nodes').appendChild(b);}keep.add(p.id);b.style.left=`${p.x}px`;b.style.top=`${p.y}px`;b.className=`lesson-node${active===p.id?' current':''}${visited.has(p.id)?' visited':''}`;b.setAttribute('aria-label',`${item.title}. ${item.summary}${visited.has(p.id)?' Previously visited.':''}`);b.setAttribute('aria-current',active===p.id?'page':'false');}
    for(const [id,b] of old)if(!keep.has(id))b.remove();
    $('map-paging').hidden=g.pages<=1;$('map-prev').disabled=page===0;$('map-next').disabled=page===g.pages-1;$('page-dots').innerHTML=Array.from({length:g.pages},(_,i)=>`<span class="${i===page?'active':''}"></span>`).join('');updateChrome();
  }
  function pauseCurrent(){
    if(!frame)return Promise.resolve();
    const request=++requestId;
    return new Promise(resolve=>{
      const timeout=setTimeout(()=>{pending.delete(request);resolve();},180);
      pending.set(request,()=>{clearTimeout(timeout);resolve();});
      frame.contentWindow.postMessage({channel,type:'pause',request},'*');
    });
  }
  function setHash(hash,replace=false){try{history[replace?'replaceState':'pushState'](null,'',hash);}catch{location.hash=hash;}}
  async function openLesson(id,updateUrl=true){
    if(!byId.has(id))return;const ticket=++operation;
    await pauseCurrent();if(ticket!==operation)return;
    if(active!==id||!frame){
      frame?.remove();active=id;frame=document.createElement('iframe');frame.title=`${byId.get(id).title} — Mathematics in Motion`;frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.setAttribute('allow','fullscreen');
      if(MotionPayloads)frame.srcdoc=MotionPayloads[id];else frame.src=byId.get(id).file;
      $('lesson-frame').appendChild(frame);
    }
    if(!CatalogModel.opening(catalog).some(x=>x.id===id))scope='all';
    mapOpen=false;$('lesson-map').hidden=true;$('lesson-frame').hidden=false;visited.add(id);persist();updateChrome();
    if(updateUrl)setHash(`#${id}`);$('catalog-status').textContent=`${byId.get(id).title} opened.`;frame.focus({preventScroll:true});
  }
  async function openMap(updateUrl=true,requestedScope=null){
    const ticket=++operation;await pauseCurrent();if(ticket!==operation)return;
    if(requestedScope)scope=requestedScope;
    mapOpen=true;$('lesson-frame').hidden=true;$('lesson-map').hidden=false;
    page=scope==='all'&&active?Math.floor(CatalogModel.ordered(catalog).findIndex(x=>x.id===active)/9):0;
    drawMap();if(updateUrl)setHash(scope==='opening'?'#start':'#map');
    const focus=[...$('map-nodes').children].find(b=>b.dataset.lesson===active)||$('map-nodes').children[0];focus?.focus({preventScroll:true});
  }
  window.addEventListener('message',event=>{
    if(!frame||event.source!==frame.contentWindow||event.data?.channel!==channel||event.data.lesson!==active)return;
    const data=event.data;
    if(data.type==='ready')frame.contentWindow.postMessage({channel,type:'restore',state:states.get(active)||null},'*');
    if((data.type==='state'||data.type==='paused')&&data.state&&typeof data.state==='object')states.set(active,data.state);
    if(data.type==='paused'){pending.get(data.request)?.();pending.delete(data.request);}
  });
  $('map-button').addEventListener('click',()=>{if(mapOpen&&active)openLesson(active);else openMap();});
  $('continue-button').addEventListener('click',()=>{const next=nextLesson();if(next)openLesson(next.id);else openMap(true,'all');});
  $('scope-button').addEventListener('click',()=>openMap(true,scope==='opening'?'all':'opening'));
  $('map-prev').addEventListener('click',()=>{if(page>0){page--;drawMap();}});$('map-next').addEventListener('click',()=>{if((page+1)*9<catalog.length){page++;drawMap();}});
  function route(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch{}if(byId.has(id))openLesson(id,false);else openMap(false,id==='map'?'all':'opening');}
  window.addEventListener('hashchange',route);window.addEventListener('popstate',route);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseCurrent();});
  new ResizeObserver(()=>{if(mapOpen)drawMap();}).observe($('map-field'));
  route();
})();
</script>
