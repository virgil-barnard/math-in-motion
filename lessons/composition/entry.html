<!doctype html>
<html lang="en" data-lesson="composition">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1420">
<meta name="description" content="A wordless collection of interactive mathematical mechanisms. Pair, sort, and compose. Works offline.">
<title>Composition · Mathematics in Motion</title>
<style><!-- @include ../../src/style.css --></style>
</head>
<body>
<main id="motion-app" data-edition="composition">
  <h1 class="sr-only" id="lesson-title">Mathematics in Motion</h1>
  <header class="app-header">
    <div class="signature" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="3"/><path d="M20 3v5M20 32v5M3 20h5M32 20h5"/></svg></div>
    <nav id="lesson-nav" aria-label="Choose a mathematical experience"></nav>
    <button class="icon-button audio-button" id="sound" type="button" aria-label="Enable optional sound" aria-pressed="false"></button>
  </header>
  <section id="stage" aria-labelledby="lesson-title" aria-describedby="lesson-description">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"></svg>
    <div id="objects"></div>
  </section>
  <footer class="app-footer">
    <div class="transport">
      <button class="play-button" id="play" type="button" aria-label="Play the transformation"></button>
      <label class="sr-only" for="timeline">Inspect the transformation</label>
      <input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-describedby="timeline-description">
      <button class="icon-button" id="rewind" type="button" aria-label="Return to the start of this transformation"></button>
    </div>
    <div class="tools">
      <button class="tool-button" id="arrange" type="button" aria-label="Rearrange the same objects"></button>
      <div class="lesson-seal" id="lesson-seal" aria-hidden="true"></div>
      <button class="tool-button" id="example" type="button" aria-label="Explore another example"></button>
    </div>
  </footer>
  <p id="lesson-description" class="sr-only"></p>
  <p id="timeline-description" class="sr-only"></p>
  <p id="status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
</main>
<script><!-- @include ../../src/core.js --></script>
<script><!-- @include ../../src/bridge.js --></script>
<script><!-- @include ../../src/app.js --></script>
</body>
</html>
